<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plano de estudos · Exame de Ordem</title>
<meta name="description" content="Cronograma personalizado de estudos para o Exame de Ordem Unificado, sincronizado com o curso preparatório da EBRADI.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%96%EF%B8%8F%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#1B2A4A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Public+Sans:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2EFE4;
  --paper-alt:#E9E3D2;
  --paper-line:rgba(27,42,74,.14);
  --ink:#1B2A4A;
  --ink-dark:#101A2E;
  --ink-soft:#3C4A68;
  --garnet:#7A1F2B;
  --garnet-dark:#5C1620;
  --garnet-soft:rgba(122,31,43,.10);
  --gold:#A9761F;
  --green:#3F6B4A;
  --green-soft:rgba(63,107,74,.12);
  --text:#1A1710;
  --text-muted:#6B6353;
  --card:#FBF9F2;
  --shadow:0 1px 2px rgba(16,26,46,.06), 0 6px 18px rgba(16,26,46,.07);
  --radius-s:3px;
  --radius-m:6px;
  --font-display:'Source Serif 4', Georgia, 'Times New Roman', serif;
  --font-body:'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-sign:'Caveat', cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#171B22;
    --paper-alt:#1D222B;
    --paper-line:rgba(196,204,224,.14);
    --ink:#9FB2D9;
    --ink-dark:#C7D3EC;
    --ink-soft:#8894AC;
    --garnet:#D9808A;
    --garnet-dark:#E9A6AE;
    --garnet-soft:rgba(217,128,138,.14);
    --gold:#D6AD62;
    --green:#7FBF92;
    --green-soft:rgba(127,191,146,.14);
    --text:#EAE6DA;
    --text-muted:#A5A192;
    --card:#1E232C;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#171B22;
  --paper-alt:#1D222B;
  --paper-line:rgba(196,204,224,.14);
  --ink:#9FB2D9;
  --ink-dark:#C7D3EC;
  --ink-soft:#8894AC;
  --garnet:#D9808A;
  --garnet-dark:#E9A6AE;
  --garnet-soft:rgba(217,128,138,.14);
  --gold:#D6AD62;
  --green:#7FBF92;
  --green-soft:rgba(127,191,146,.14);
  --text:#EAE6DA;
  --text-muted:#A5A192;
  --card:#1E232C;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--text);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--garnet-soft);}

.wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px;}

/* ---------- Header / capa de autos ---------- */
.capa{
  background:var(--ink);
  color:var(--paper);
  padding:28px 20px 22px;
  position:relative;
  border-bottom:6px solid var(--garnet);
}
.capa::after{
  content:"";
  position:absolute; left:0; right:0; bottom:-6px; height:6px;
}
.capa-inner{max-width:1180px;margin:0 auto;}
.capa-user{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:0 0 16px;
}
.capa-hello{
  margin:0;
  font-family:var(--font-display);
  font-size:18px;
  font-weight:600;
  color:var(--paper);
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.capa-handle{
  font-family:var(--font-body);
  font-size:12px;
  font-weight:500;
  opacity:.6;
  margin-left:6px;
}
.capa-logout{
  appearance:none;
  flex-shrink:0;
  background:transparent;
  color:var(--paper);
  border:1px solid currentColor;
  opacity:.8;
  padding:5px 12px;
  border-radius:var(--radius-s);
  font-size:12px;
  font-weight:600;
  cursor:pointer;
}
.capa-logout:hover{opacity:1;}
.capa-logout[disabled]{opacity:.5;cursor:wait;}
.capa-title{
  font-family:var(--font-display);
  font-weight:600;
  font-size:clamp(24px,4vw,34px);
  margin:0 0 4px;
  letter-spacing:-.01em;
}
.capa-sub{
  margin:0;
  font-size:13.5px;
  color:rgba(242,239,228,.72);
}
.capa-meta{
  display:flex;
  flex-wrap:wrap;
  gap:10px 26px;
  margin-top:18px;
  padding-top:16px;
  border-top:1px solid rgba(242,239,228,.16);
}
.capa-meta div{min-width:140px;}
.capa-meta .k{
  display:block;
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:rgba(242,239,228,.55);
  margin-bottom:2px;
}
.capa-meta .v{
  font-size:14px;
  font-weight:600;
  color:var(--paper);
}

.capa-sub{max-width:70ch;}

/* ---------- Nav (abas de pasta) ---------- */
.tabbar{
  max-width:1180px;
  width:100%;
  margin:0 auto;
  display:flex;
  gap:4px;
  padding:0 20px;
  margin-top:-1px;
  overflow-x:auto;
}
.tabbar button{
  appearance:none;
  border:1px solid var(--paper-line);
  border-bottom:none;
  background:var(--paper-alt);
  color:var(--text-muted);
  padding:10px 16px 9px;
  font-size:13.5px;
  font-weight:600;
  border-radius:6px 6px 0 0;
  cursor:pointer;
  white-space:nowrap;
  transition:background .15s, color .15s;
}
.tabbar button:hover{color:var(--text);}
.tabbar button.active{
  background:var(--card);
  color:var(--garnet);
  border-color:var(--paper-line);
  box-shadow:0 -2px 0 var(--garnet) inset;
}
.tab-body{
  background:var(--card);
  border:1px solid var(--paper-line);
  border-radius:0 6px 6px 6px;
  padding:28px 32px;
  margin:0 auto;
  max-width:1180px;
  box-shadow:var(--shadow);
}
.view{display:none;}
.view.active{display:block;}

h2.view-title{
  font-family:var(--font-display);
  font-size:20px;
  font-weight:600;
  margin:0 0 4px;
  color:var(--ink);
}
.view-sub{color:var(--text-muted);font-size:13px;margin:0 0 20px;}

/* ---------- Dashboard ---------- */
.dash-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:14px;
  margin-bottom:22px;
}
@media (min-width:860px){ .dash-grid{grid-template-columns:repeat(3,1fr);} }
.stat-card{
  background:var(--paper);
  border:1px solid var(--paper-line);
  border-radius:var(--radius-m);
  padding:14px 16px;
}
.stat-card.stat-pendentes{cursor:pointer;transition:border-color .15s, background .15s;}
.stat-card.stat-pendentes:hover{background:var(--garnet-soft);border-color:var(--garnet);}
.stat-card .label{
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:.05em;
  color:var(--text-muted);
  margin-bottom:6px;
  font-weight:600;
}
.stat-card .value{
  font-family:var(--font-display);
  font-size:26px;
  font-weight:600;
  color:var(--ink);
  line-height:1.1;
}
.stat-card .value small{font-size:13px;font-weight:500;color:var(--text-muted);}
.stat-card .foot{font-size:12px;color:var(--text-muted);margin-top:4px;}

.prazo-fatal{
  background:var(--garnet);
  color:#fff;
  border-radius:var(--radius-m);
  padding:18px 20px;
  margin-bottom:20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:14px;
}
.prazo-fatal .pf-label{
  font-size:11px;
  letter-spacing:.06em;
  text-transform:uppercase;
  opacity:.85;
  margin-bottom:4px;
}
.prazo-fatal .pf-sub{font-size:12.5px;opacity:.82;margin-top:4px;}
.pf-count{display:flex;gap:16px;}
.pf-count div{text-align:center;}
.pf-count .n{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1;}
.pf-count .u{display:block;font-size:10px;letter-spacing:.05em;text-transform:uppercase;opacity:.8;margin-top:3px;}

.progress-outer{
  background:var(--paper-alt);
  border-radius:20px;
  height:9px;
  overflow:hidden;
  margin:8px 0;
}
.progress-inner{
  background:var(--green);
  height:100%;
  border-radius:20px;
  transition:width .3s;
}

.andamento-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:12.5px;
  font-weight:600;
  padding:5px 10px;
  border-radius:20px;
  background:var(--green-soft);
  color:var(--green);
}
.andamento-badge.atraso{background:var(--garnet-soft);color:var(--garnet);}
.prazo-fatal .andamento-badge{background:rgba(255,255,255,.16);color:#fff;margin-top:6px;}
.prazo-fatal .andamento-badge.atraso{background:#fff;color:#7A1F2B;}

.section-block{margin-top:26px;}
.section-block h3{
  font-family:var(--font-display);
  font-size:15.5px;
  margin:0 0 12px;
  color:var(--ink);
  font-weight:600;
}

.disc-list{display:flex;flex-direction:column;gap:8px;}
@media (min-width:860px){
  .disc-list{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;}
}
.disc-row{
  display:grid;
  grid-template-columns:1fr auto 90px;
  align-items:center;
  gap:10px;
  font-size:12.5px;
}
.disc-row .name{color:var(--text);}
.disc-row .count{color:var(--text-muted);font-variant-numeric:tabular-nums;white-space:nowrap;}
.disc-row .bar-outer{background:var(--paper-alt);border-radius:10px;height:6px;overflow:hidden;}
.disc-row .bar-inner{background:var(--ink);height:100%;}

.evol-chart{display:flex;align-items:flex-end;gap:3px;height:70px;margin-top:6px;}
.evol-bar{flex:1;background:var(--paper-alt);border-radius:2px 2px 0 0;position:relative;min-width:4px;}
.evol-bar .fill{position:absolute;bottom:0;left:0;right:0;background:var(--gold);border-radius:2px 2px 0 0;}
.evol-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);margin-top:4px;}

/* ---------- Daily view ---------- */
.day-nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:18px;
  flex-wrap:wrap;
}
.day-nav .nav-btns{display:flex;gap:6px;}
.iconbtn{
  border:1px solid var(--paper-line);
  background:var(--paper);
  color:var(--ink);
  width:32px;height:32px;
  border-radius:var(--radius-s);
  cursor:pointer;
  font-size:15px;
  display:flex;align-items:center;justify-content:center;
}
.iconbtn:hover{background:var(--paper-alt);}
.today-btn{
  border:1px solid var(--ink);
  background:var(--ink);
  color:var(--paper);
  padding:0 14px;
  height:32px;
  border-radius:var(--radius-s);
  font-size:12.5px;
  font-weight:600;
  cursor:pointer;
}
.day-date-big{
  font-family:var(--font-display);
  font-size:19px;
  font-weight:600;
  color:var(--ink);
}
.day-date-big .dow{
  font-family:var(--font-body);
  font-size:12px;
  font-weight:600;
  color:var(--garnet);
  text-transform:uppercase;
  letter-spacing:.05em;
  display:block;
  margin-bottom:2px;
}
.daypick{
  border:1px solid var(--paper-line);
  background:var(--paper);
  color:var(--text);
  border-radius:var(--radius-s);
  padding:6px 8px;
  font-size:13px;
  font-family:inherit;
}

.folio-tag{
  font-family:var(--font-body);
  font-size:10.5px;
  color:var(--text-muted);
  font-variant-numeric:tabular-nums;
}

.lesson-list{}
@media (min-width:860px){
  .lesson-list{column-count:2;column-gap:32px;}
  .lesson-item{break-inside:avoid;}
}
.lesson-item{
  display:flex;
  gap:12px;
  align-items:flex-start;
  padding:12px 4px;
  border-bottom:1px solid var(--paper-line);
}
.lesson-item:last-child{border-bottom:none;}
.lesson-item input[type=checkbox]{
  width:19px;height:19px;
  margin-top:2px;
  accent-color:var(--green);
  cursor:pointer;
  flex-shrink:0;
}
.lesson-item .li-body{flex:1;min-width:0;}
.lesson-item .li-disc{
  font-size:11px;
  font-weight:600;
  color:var(--garnet);
  text-transform:uppercase;
  letter-spacing:.03em;
  margin-bottom:2px;
}
.lesson-item .li-title{
  font-size:14px;
  color:var(--text);
}
.lesson-item.done .li-title{color:var(--text-muted);text-decoration:line-through;text-decoration-color:var(--paper-line);}
.lesson-item .li-meta{font-size:11px;color:var(--text-muted);margin-top:2px;}
.lesson-item.overdue{background:var(--garnet-soft);border-radius:var(--radius-s);margin:0 -8px;padding:12px 8px;}
.pending-badge{
  display:inline-block;
  background:var(--garnet);
  color:#fff;
  font-size:9.5px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.03em;
  padding:2px 7px;
  border-radius:10px;
  vertical-align:middle;
  margin-left:4px;
}
.makeup-block{
  margin-top:22px;
  padding-top:18px;
  border-top:2px dashed var(--garnet);
}
.makeup-title{
  font-family:var(--font-display);
  color:var(--garnet-dark);
  font-size:15.5px;
  margin:0 0 4px;
  font-weight:600;
}
.makeup-sub{font-size:12px;color:var(--text-muted);margin:0 0 14px;}

.pend-list{display:flex;flex-direction:column;gap:8px;}
.pend-row{
  display:flex;
  align-items:flex-start;
  gap:12px;
  padding:12px;
  border:1px solid var(--paper-line);
  border-radius:var(--radius-m);
  background:var(--garnet-soft);
}
.pend-row input[type=checkbox]{width:19px;height:19px;margin-top:2px;accent-color:var(--green);cursor:pointer;flex-shrink:0;}
.pend-body{flex:1;min-width:0;}
.pend-dates{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;margin-top:4px;}
.pend-orig{color:var(--garnet-dark);font-weight:600;}
.pend-target{color:var(--text-muted);}
.pend-open{flex-shrink:0;align-self:center;}
@media (min-width:860px){
  .pend-list{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;}
}

.day-summary-bar{
  display:flex;align-items:center;gap:10px;
  background:var(--paper);
  border:1px solid var(--paper-line);
  border-radius:var(--radius-m);
  padding:10px 14px;
  margin-bottom:16px;
}
.day-summary-bar .progress-outer{flex:1;margin:0;}
.day-summary-bar .txt{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;}

.review-card{
  background:var(--garnet-soft);
  border:1px solid rgba(122,31,43,.22);
  border-radius:var(--radius-m);
  padding:18px 20px;
}
.review-card h3{
  font-family:var(--font-display);
  color:var(--garnet-dark);
  margin:0 0 6px;
  font-size:17px;
}
.review-card p{font-size:13px;color:var(--text-muted);margin:0 0 14px;}
.review-check{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.review-check input{width:19px;height:19px;accent-color:var(--garnet);}
.review-check label{font-size:13.5px;font-weight:600;}
textarea.notes{
  width:100%;
  min-height:70px;
  border:1px solid var(--paper-line);
  border-radius:var(--radius-s);
  padding:10px;
  font-family:inherit;
  font-size:13px;
  background:var(--card);
  color:var(--text);
  resize:vertical;
}

.simulado-wrap h3{
  font-family:var(--font-display);
  color:var(--gold);
  margin:0 0 4px;
  font-size:17px;
}
.simulado-wrap>p{font-size:13px;color:var(--text-muted);margin:0 0 16px;}
.sim-entry{
  border:1px solid var(--paper-line);
  border-radius:var(--radius-m);
  padding:16px;
  margin-bottom:14px;
  background:var(--paper);
}
.sim-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:12px;
}
.sim-grid .full{grid-column:1/-1;}
.field label{
  display:block;
  font-size:11px;
  font-weight:600;
  color:var(--text-muted);
  text-transform:uppercase;
  letter-spacing:.03em;
  margin-bottom:5px;
}
.field input[type=text], .field input[type=number]{
  width:100%;
  border:1px solid var(--paper-line);
  border-radius:var(--radius-s);
  padding:8px 10px;
  font-size:13.5px;
  font-family:inherit;
  background:var(--card);
  color:var(--text);
}
.field input:focus, textarea:focus{outline:2px solid var(--ink);outline-offset:1px;}
.sim-file{
  border:1px dashed var(--paper-line);
  border-radius:var(--radius-s);
  padding:10px 12px;
  font-size:12.5px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:var(--card);
  margin-bottom:14px;
}
.sim-file .fname{color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sim-file.uploading{opacity:.7;}
.sim-file.uploading label{pointer-events:none;}
.sim-file label.btn-mini{cursor:pointer;color:var(--ink);font-weight:600;}
.sim-rows-head{
  display:grid;
  grid-template-columns:2fr 90px 90px 90px 52px 28px;
  gap:8px;
  padding:0 2px 6px;
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:.03em;
  color:var(--text-muted);
  font-weight:600;
}
.sim-row{
  display:grid;
  grid-template-columns:2fr 90px 90px 90px 52px 28px;
  gap:8px;
  align-items:center;
  margin-bottom:8px;
}
.sim-row select, .sim-row input{
  width:100%;
  border:1px solid var(--paper-line);
  border-radius:var(--radius-s);
  padding:7px 8px;
  font-size:13px;
  font-family:inherit;
  background:var(--card);
  color:var(--text);
}
.sim-row .sim-row-pct{font-size:12.5px;font-weight:600;color:var(--ink);text-align:center;}
.sim-row .row-remove{
  border:none;background:transparent;color:var(--text-muted);
  font-size:17px;line-height:1;cursor:pointer;padding:2px;
}
.sim-row .row-remove:hover{color:var(--garnet);}
.btn-add-row{
  border:1px dashed var(--paper-line);
  background:transparent;
  color:var(--ink-soft);
  padding:6px 10px;
  border-radius:var(--radius-s);
  font-size:11.5px;
  font-weight:600;
  cursor:pointer;
  margin-bottom:14px;
}
.sim-stats{
  background:var(--green-soft);
  border-radius:var(--radius-s);
  padding:10px 12px;
  font-size:12.5px;
  color:var(--green);
  margin-bottom:12px;
}
.sim-stats-sub{color:var(--text-muted);font-weight:400;}
.sim-overall{
  font-size:14px;
  color:var(--ink);
  background:var(--paper);
  border:1px solid var(--paper-line);
  border-radius:var(--radius-s);
  padding:12px 14px;
  margin-bottom:14px;
}
.sim-stat-list{display:flex;flex-direction:column;gap:8px;}
@media (min-width:860px){
  .sim-stat-list{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;}
}
.sim-stat-row{
  display:grid;
  grid-template-columns:1fr auto;
  grid-template-areas:"name pct" "qae qae" "bar bar";
  gap:2px 8px;
  font-size:12px;
  padding:6px 0;
  border-bottom:1px solid var(--paper-line);
}
.sim-stat-row .name{grid-area:name;color:var(--text);font-weight:600;}
.sim-stat-row .pct{grid-area:pct;font-weight:700;color:var(--ink);}
.sim-stat-row .qae{grid-area:qae;color:var(--text-muted);font-size:11px;}
.sim-stat-row .bar-outer{grid-area:bar;background:var(--paper-alt);border-radius:10px;height:5px;overflow:hidden;margin-top:2px;}

.hist-list{display:flex;flex-direction:column;gap:6px;}
.hist-row{
  display:grid;
  grid-template-columns:64px 1fr 56px;
  gap:12px;
  align-items:center;
  padding:10px 12px;
  border:1px solid var(--paper-line);
  border-radius:var(--radius-m);
  background:var(--paper);
  cursor:pointer;
}
.hist-row:hover{background:var(--paper-alt);}
.hist-date{font-family:var(--font-display);font-size:15px;color:var(--ink);font-weight:600;line-height:1.15;}
.hist-date .hist-year{display:block;font-family:var(--font-body);font-size:10px;color:var(--text-muted);font-weight:400;}
.hist-body{min-width:0;}
.hist-chips{display:flex;flex-wrap:wrap;gap:5px;}
.hist-chip{
  font-size:11px;
  background:var(--paper-alt);
  color:var(--ink-soft);
  padding:2px 8px;
  border-radius:10px;
  white-space:nowrap;
}
.hist-file{font-size:11px;color:var(--text-muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hist-pct{font-size:15px;font-weight:700;color:var(--ink);text-align:right;}
@media (max-width:600px){
  .hist-row{grid-template-columns:52px 1fr 44px;padding:9px 10px;}
}
.sim-result{font-size:12.5px;color:var(--text-muted);}
.sim-actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
.btn{
  border:1px solid var(--ink);
  background:var(--ink);
  color:var(--paper);
  padding:8px 14px;
  border-radius:var(--radius-s);
  font-size:12.5px;
  font-weight:600;
  cursor:pointer;
}
.btn.ghost{background:transparent;color:var(--ink);}
.btn.danger{border-color:var(--garnet);background:transparent;color:var(--garnet);}
.btn-add{
  border:1px dashed var(--ink);
  background:transparent;
  color:var(--ink);
  padding:9px 14px;
  border-radius:var(--radius-s);
  font-size:12.5px;
  font-weight:600;
  cursor:pointer;
  width:100%;
}

/* ---------- Painel: cabeçalho, plano, EBRADI ---------- */
.painel-head{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:18px;align-items:start;}
@media (min-width:860px){ .painel-head{grid-template-columns:1fr 380px;gap:28px;} }
.painel-head .view-sub{margin-bottom:0;}
.ebradi-note{
  margin:0;padding:10px 14px;
  border-left:3px solid var(--green);
  background:var(--green-soft);
  font-size:12.5px;line-height:1.5;color:var(--text);
  border-radius:0 var(--radius-s) var(--radius-s) 0;
}
.ebradi-note strong{color:var(--green);}
.h3-note{font-weight:400;color:var(--text-muted);font-size:12px;font-family:var(--font-body);}
.painel-cols{display:grid;grid-template-columns:1fr;gap:0 40px;}
@media (min-width:860px){ .painel-cols{grid-template-columns:1fr 1fr;} }
.kv-list{display:flex;flex-direction:column;}
.kv-row{grid-template-columns:1fr auto !important;padding:7px 0;border-bottom:1px solid var(--paper-line);}
.kv-row .count{color:var(--text);font-weight:600;text-align:right;white-space:normal;}
.kv-foot{font-size:11.5px;color:var(--text-muted);margin:8px 0 0;}
.plan-warn{margin:12px 0 0;padding:10px 12px;background:var(--garnet-soft);color:var(--garnet-dark);font-size:12.5px;border-radius:var(--radius-s);}
.plan-adjust{margin-top:14px;}
.day-sub{font-family:var(--font-display);font-size:15.5px;font-weight:600;color:var(--ink);margin:22px 0 10px;}
.lesson-item.f2 .li-disc{color:var(--gold);}
.type-tag.exam{background:var(--garnet);color:#fff;}
.week-title{font-family:var(--font-display);font-weight:600;color:var(--ink);font-size:15px;}
.cal-cell.exam{box-shadow:0 0 0 2px var(--garnet) inset;}
.cal-cell.off .dn{color:var(--text-muted);font-weight:500;}
.cal-cell .dot.exam{background:var(--garnet);width:9px;height:9px;}

.rest-note{
  text-align:center;
  padding:40px 20px;
  color:var(--text-muted);
  font-size:13.5px;
}
.rest-note .big{font-family:var(--font-display);font-size:20px;color:var(--ink);display:block;margin-bottom:6px;}

/* ---------- Weekly ---------- */
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.week-list{display:flex;flex-direction:column;gap:8px;}
.week-row{
  display:grid;
  grid-template-columns:78px 1fr auto;
  align-items:center;
  gap:12px;
  padding:11px 12px;
  border:1px solid var(--paper-line);
  border-radius:var(--radius-m);
  cursor:pointer;
  background:var(--paper);
}
.week-row:hover{background:var(--paper-alt);}
.week-row.nolink{cursor:default;}
.week-row.nolink:hover{background:var(--paper);}
.week-row.today{border-color:var(--garnet);box-shadow:0 0 0 1px var(--garnet) inset;}
.week-row .wd{
  font-size:11px;font-weight:700;color:var(--garnet);text-transform:uppercase;letter-spacing:.04em;
}
.week-row .wd .dt{display:block;font-size:15px;color:var(--ink);font-family:var(--font-display);margin-top:1px;}
.week-row .wsum .type-tag{
  font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  padding:2px 7px;border-radius:10px;margin-right:7px;
}
.type-tag.content{background:var(--paper-alt);color:var(--ink-soft);}
.type-tag.review{background:var(--garnet-soft);color:var(--garnet);}
.type-tag.simulado{background:rgba(169,118,31,.14);color:var(--gold);}
.type-tag.off{background:transparent;color:var(--text-muted);}
.week-row .wdesc{font-size:12.5px;color:var(--text-muted);margin-top:3px;}
.week-row .wprog{font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;}
.wdesc-makeup{color:var(--garnet);font-weight:600;}
.wprog-overdue{color:var(--garnet);}

/* ---------- Monthly ---------- */
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.month-title{font-family:var(--font-display);font-size:18px;color:var(--ink);font-weight:600;}
.cal-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
}
.cal-dow{
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  color:var(--text-muted);text-align:center;padding-bottom:4px;
}
.cal-cell{
  aspect-ratio:1/1;
  border:1px solid var(--paper-line);
  border-radius:var(--radius-s);
  padding:5px 6px;
  cursor:pointer;
  background:var(--paper);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  min-height:52px;
}
.cal-cell:hover{background:var(--paper-alt);}
@media (min-width:860px){ .cal-cell{aspect-ratio:auto;height:74px;} }
.cal-cell.empty{visibility:hidden;cursor:default;}
.cal-cell.today{border-color:var(--garnet);border-width:2px;}
.cal-cell .dn{font-size:12px;font-weight:600;color:var(--text);}
.cal-cell .dot{width:7px;height:7px;border-radius:50%;align-self:flex-end;}
.cal-cell .dot.content{background:var(--ink-soft);}
.cal-cell .dot.review{background:var(--garnet);}
.cal-cell .dot.simulado{background:var(--gold);}
.cal-cell.done{background:var(--green-soft);}
.cal-cell.done .dn{color:var(--green);}
.cal-legend{display:flex;gap:16px;margin-top:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text-muted);}
.cal-legend span{display:inline-flex;align-items:center;gap:5px;}
.cal-legend i{width:8px;height:8px;border-radius:50%;display:inline-block;}

/* ---------- Footer / assinatura ---------- */
footer{
  max-width:1180px;width:100%;margin:22px auto 0;padding:0 20px 36px;
}
.foot-note{margin:4px 0 0;font-size:11.5px;color:var(--text-muted);max-width:62ch;}
.sync-status{font-size:11.5px;font-weight:600;}
.sig-caption{font-size:10.5px;color:var(--text-muted);letter-spacing:.03em;}
.sync-status{font-size:10.5px;color:var(--text-muted);min-height:14px;}
.sync-status.ok{color:var(--green);}
.sync-status.error{color:var(--garnet);}
.sync-status.pending{color:var(--gold);}

.boot-overlay{
  position:fixed;inset:0;z-index:1000;
  background:var(--paper);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.boot-card{
  background:var(--card);
  border:1px solid var(--paper-line);
  border-radius:var(--radius-m);
  box-shadow:var(--shadow);
  padding:32px 28px;
  max-width:340px;
  width:100%;
  text-align:center;
}
.boot-card p{font-size:13.5px;color:var(--text-muted);margin:0 0 14px;}
.boot-title{
  font-family:var(--font-display);
  color:var(--ink);
  font-size:19px;
  margin:0 0 10px;
  font-weight:600;
}
.boot-error{color:var(--garnet) !important;font-weight:600;}
.boot-input{
  width:100%;
  border:1px solid var(--paper-line);
  border-radius:var(--radius-s);
  padding:10px 12px;
  font-size:14px;
  font-family:inherit;
  background:var(--paper);
  color:var(--text);
  margin-bottom:12px;
  box-sizing:border-box;
}
.boot-spinner{
  width:30px;height:30px;
  border:3px solid var(--paper-line);
  border-top-color:var(--garnet);
  border-radius:50%;
  margin:0 auto 16px;
  animation:boot-spin 0.8s linear infinite;
}

.auth-card .boot-title{font-size:21px;}
.auth-field{margin-bottom:12px;}

.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{position:relative;cursor:pointer;}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;}
.chip span{
  display:flex;flex-direction:column;justify-content:center;
  min-height:36px;padding:7px 13px;
  border:1px solid var(--paper-line);border-radius:18px;
  background:var(--paper);color:var(--text);
  font-size:13px;font-weight:600;line-height:1.25;
  transition:background .12s, border-color .12s, color .12s;
}
.chip span small{font-size:11.5px;font-weight:500;color:var(--text-muted);margin-top:2px;}
.chip:hover span{border-color:var(--ink-soft);}
.chip input:checked + span{background:var(--ink);border-color:var(--ink);color:var(--paper);}
.chip input:checked + span small{color:var(--paper);opacity:.8;}
.chip input:focus-visible + span{outline:2px solid var(--garnet);outline-offset:2px;}
.chips-exam{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));}
.chips-exam .chip span{border-radius:var(--radius-m);padding:10px 14px;}
.onb-preview{
  border-left:3px solid var(--gold);
  background:var(--paper);
  padding:11px 14px;margin:4px 0 16px;
  font-size:13px;line-height:1.55;color:var(--text);
}
.onb-preview[hidden]{display:none;}
.onb-warn{display:block;margin-top:6px;color:var(--garnet);font-weight:600;}
.onb-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.onb-submit{padding:10px 18px;font-size:13.5px;}
.onb-submit[disabled]{opacity:.6;cursor:wait;}
@media (max-width:600px){
  .onb-card{padding:22px 18px 20px;}
  .boot-overlay.scroll{padding:12px 10px;}
}

@keyframes boot-spin{ to{ transform:rotate(360deg); } }

<script>
(function(){
"use strict";

/* ============ DADOS (catálogo de aulas EBRADI + datas dos exames) ============ */
var CATALOG = JSON.parse(document.getElementById('catalog-data').textContent);
var EXAMS = CATALOG.exams;
var EXAM_BY_ID = {};
EXAMS.forEach(function(e){ EXAM_BY_ID[e.id] = e; });
var F1 = CATALOG.fase1;
var F1_BY_ID = {};

var F1_TOTAL = F1.reduce(function(sum, d){ return sum + d.lessons.length; }, 0);
var F2 = CATALOG.fase2;
var F2_BY_ID = {};
F2.forEach(function(d){ F2_BY_ID[d.id] = d; });

var MIN_PER_LESSON = 15; // duração média de uma aula, usada para converter horas em aulas

// Preenchidos por applyPlan() a partir das respostas do usuário
var PROFILE = null, PLAN = null, META = {};
var DISCIPLINES = [], DISC_BY_ID = {};
var DAYS = [], DAY_BY_DATE = {}, DATE_LIST = [];
var FIRST_DATE = '', LAST_DATE = '';
var LESSON_INDEX = {}, PLAN_LESSON_IDS = [];

/* ============ DATA UTILS ============ */
var DOW_NAMES = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
var DOW_SHORT = ['DOM','SEG','TER','QUA','QUI','SEX','SAB'];
var MONTH_NAMES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

function pad2(n){ return (n<10?'0':'')+n; }
function dateToKey(dt){ return dt.getFullYear()+'-'+pad2(dt.getMonth()+1)+'-'+pad2(dt.getDate()); }
function keyToDate(key){
  var p = key.split('-');
  return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
}
function addDays(key, n){
  var dt = keyToDate(key);
  dt.setDate(dt.getDate()+n);
  return dateToKey(dt);
}
function todayKey(){ return dateToKey(new Date()); }
function fmtDateLong(key){
  var dt = keyToDate(key);
  return dt.getDate()+' de '+MONTH_NAMES[dt.getMonth()]+' de '+dt.getFullYear();
}
function fmtDateShort(key){
  var dt = keyToDate(key);
  return pad2(dt.getDate())+'/'+pad2(dt.getMonth()+1);
}
function clampKey(key){
  if(key < FIRST_DATE) return FIRST_DATE;
  if(key > LAST_DATE) return LAST_DATE;
  return key;
}
function mondayOf(key){
  var dt = keyToDate(key);
  var dow = dt.getDay(); // 0=sun
  var diff = (dow === 0) ? -6 : (1-dow);
  dt.setDate(dt.getDate()+diff);
  return dateToKey(dt);
}

/* ============ PLANO (gerado a partir das respostas do usuário) ============ */
function pad3(n){ return (n<10?'00':(n<100?'0':''))+n; }
function fmtDateBr(key){ var dt = keyToDate(key); return pad2(dt.getDate())+'/'+pad2(dt.getMonth()+1)+'/'+dt.getFullYear(); }
function addMonths(key, n){
  var dt = keyToDate(key);
  var day = dt.getDate();
  dt.setDate(1);
  dt.setMonth(dt.getMonth()+n);
  var last = new Date(dt.getFullYear(), dt.getMonth()+1, 0).getDate();
  dt.setDate(Math.min(day, last));
  return dateToKey(dt);
}
// Distribui n itens entre posições, proporcionalmente aos pesos (a soma dá exatamente n).
function spread(n, weights){
  var tot = 0;
  weights.forEach(function(w){ tot += w; });
  var out = [], acc = 0, prev = 0;
  weights.forEach(function(w){
    acc += w;
    var r = tot>0 ? Math.round(acc/tot*n) : 0;
    out.push(r-prev);
    prev = r;
  });
  return out;
}
function lessonCap(hours){ return Math.max(1, Math.floor(hours*60/MIN_PER_LESSON)); }
function weeklyPhrase(dow){ return (dow===0 || dow===6 ? 'todo ' : 'toda ')+DOW_NAMES[dow].toLowerCase(); }
function hoursTxt(h){ return String(Math.round(h*2)/2).replace('.', ',')+' h'; }
function isValidProfile(p){
  return !!(p && EXAM_BY_ID[p.exam] && Number(p.hours)>=1 && Number(p.restDow)>=0 && Number(p.restDow)<=6 &&
    p.startDate && (p.fase2==='' || F2_BY_ID[p.fase2]));
}

// Distribui as aulas da 1ª fase — regra igual para todos os usuários:
// - cada dia de estudo tem UMA única disciplina (todas as aulas do dia são dela);
// - a disciplina de um dia nunca é a mesma do dia de estudo anterior;
// - as disciplinas se revezam de forma uniforme: a cada dia entra a que está mais
//   "atrasada" em relação ao ritmo ideal (todas avançam juntas e terminam perto do fim);
// - a sequência da EBRADI é mantida dentro de cada disciplina.
// O tamanho de cada dia é recalculado a cada passo (aulas que faltam ÷ espaço que falta),
// então um dia mais curto — quando a disciplina acaba — é compensado nos dias seguintes.
// Uma segunda disciplina só entra num dia se, sem ela, as aulas não coubessem até a prova.
function interleaveFase1(queues, rooms, forbid){
  forbid = forbid || [];
  var total = 0;
  queues.forEach(function(q){ total += q.n; });
  var roomTotal = 0;
  rooms.forEach(function(r){ roomTotal += r; });
  var over = roomTotal > 0 ? Math.max(1, total/roomTotal) : 1; // >1 quando o limite de horas não comporta tudo
  var roomAfter = rooms.map(function(){ return 0; });
  for(var k = rooms.length-2; k >= 0; k--) roomAfter[k] = roomAfter[k+1] + rooms[k+1];
  // Ritmo de cada disciplina: o ideal é ter cumprido, ao fim de cada dia, a mesma fração
  // do "espaço" que ela pode usar. Uma disciplina proibida em alguns dias (ex.: a matéria
  // equivalente à da 2ª fase, no mês antes da prova) tem um prazo mais curto: precisa
  // terminar até o último dia em que é permitida.
  var cumRoom = [], acc = 0;
  rooms.forEach(function(r){ acc += r; cumRoom.push(acc); });
  queues.forEach(function(q){
    var last = rooms.length-1;
    while(last > 0 && (forbid[last] || {})[q.id]) last--;
    q.until = Math.max(1, cumRoom[last] || 1);
  });
  var scheduled = 0, prevSet = {};

  return rooms.map(function(room, i){
    var left = total - scheduled;
    if(left <= 0) return [];
    var roomHere = room*over;
    var roomRest = roomHere + roomAfter[i]*over;
    var target = roomRest > 0 ? Math.round(left*roomHere/roomRest) : left;
    if(i === rooms.length-1) target = left;
    if(target <= 0) return [];

    var dayItems = [], used = {};
    function deficit(q){ return q.n*Math.min(1, cumRoom[i]/q.until) - q.done; }
    function pick(){
      var open = queues.filter(function(q){ return q.done < q.n && !used[q.id]; });
      if(!open.length) return null;
      var allowed = open.filter(function(q){ return !(forbid[i] || {})[q.id]; });
      if(allowed.length) open = allowed;
      var fresh = open.filter(function(q){ return !prevSet[q.id]; });
      var cands = fresh.length ? fresh : open;
      cands.sort(function(a,b){ return (deficit(b) - deficit(a)) || (a.idx - b.idx); });
      return cands[0];
    }
    function takeFrom(q, want){
      var rem = q.n - q.done;
      var take = Math.min(want, rem);
      // não deixa sobrar 1 ou 2 aulas soltas para outro dia: termina a disciplina hoje,
      // desde que isso caiba no limite de horas do dia
      if(rem - take > 0 && rem - take <= 2 && rem <= Math.max(want, Math.floor(roomHere))) take = rem;
      for(var t = 0; t < take; t++) dayItems.push(q.items[q.done + t]);
      q.done += take;
      used[q.id] = 1;
      return take;
    }

    // Reta final: se os dias que faltam mal dão para fechar cada disciplina em dias próprios,
    // cada dia passa a concluir uma disciplina inteira (até o limite do dia), começando pelas
    // que têm mais aulas — assim nenhuma sobra para dividir o dia com outra.
    var daysLeft = 0;
    for(var z = i; z < rooms.length; z++) if(rooms[z] > 0) daysLeft++;
    // capacidade do dia na reta final: o limite do dia, mas nunca menos que o necessário
    // para caber o que falta nos dias restantes (quando o limite de horas não comporta tudo)
    var capHere = Math.max(1, Math.floor(roomHere), Math.ceil(left/Math.max(1, daysLeft)));
    var need = 0;
    queues.forEach(function(qq){ if(qq.done < qq.n) need += Math.ceil((qq.n - qq.done)/capHere); });
    if(need >= daysLeft - 1){
      var openF = queues.filter(function(qq){ return qq.done < qq.n; });
      var allowedF = openF.filter(function(qq){ return !(forbid[i] || {})[qq.id]; });
      if(allowedF.length) openF = allowedF;
      var freshF = openF.filter(function(qq){ return !prevSet[qq.id]; });
      var candF = (freshF.length ? freshF : openF).sort(function(a,b){
        return (a.until - b.until) || ((b.n-b.done) - (a.n-a.done)) || (a.idx - b.idx);
      });
      if(candF.length){
        var qf = candF[0];
        var gotF = takeFrom(qf, Math.min(qf.n - qf.done, capHere));
        if(i === rooms.length-1){ // último dia: o que sobrar precisa entrar
          while(scheduled + gotF < total){ var qx = pick(); if(!qx) break; gotF += takeFrom(qx, total - scheduled - gotF); }
        }
        scheduled += gotF;
        if(dayItems.length) prevSet = used;
        return dayItems;
      }
    }

    var q = pick();
    if(!q) return [];
    var got = takeFrom(q, target);
    // segunda disciplina só se o que falta não couber nos dias seguintes
    while(got < target){
      var leftAfter = total - scheduled - got;
      if(i < rooms.length-1 && leftAfter <= Math.ceil(roomAfter[i]*over)) break;
      var q2 = pick();
      if(!q2) break;
      got += takeFrom(q2, target - got);
    }
    scheduled += got;
    if(dayItems.length) prevSet = used;
    return dayItems;
  });
}

// Garante uma disciplina por dia: se um dia ficou com restos de outras disciplinas, cada
// resto vai para o dia mais próximo da PRÓPRIA disciplina (o anterior, no fim da lista dela;
// ou o seguinte, no começo) — a sequência das aulas continua a mesma.
function consolidateDays(byDay){
  byDay.forEach(function(items, i){
    var groups = {};
    items.forEach(function(it){ (groups[it.disc] = groups[it.disc] || []).push(it); });
    var discs = Object.keys(groups);
    if(discs.length < 2) return;
    discs.sort(function(a,b){ return groups[b].length - groups[a].length; });
    var keep = discs[0], kept = groups[keep];
    discs.slice(1).forEach(function(d){
      var moved = false;
      for(var j = i-1; j >= 0 && !moved; j--){
        if(byDay[j].length && byDay[j].every(function(it){ return it.disc === d; })){
          byDay[j] = byDay[j].concat(groups[d]); moved = true;
        } else if(byDay[j].some(function(it){ return it.disc === d; })) break;
      }
      for(var k = i+1; k < byDay.length && !moved; k++){
        if(byDay[k].length && byDay[k].every(function(it){ return it.disc === d; })){
          byDay[k] = groups[d].concat(byDay[k]); moved = true;
        } else if(byDay[k].some(function(it){ return it.disc === d; })) break;
      }
      if(!moved) kept = kept.concat(groups[d]);
    });
    byDay[i] = kept;
  });
  return byDay;
}

function computePlan(p){
  var exam = EXAM_BY_ID[p.exam];
  var P1 = exam.primeiraFase, P2 = exam.segundaFase;
  var S = p.startDate;
  var R = Number(p.restDow), SIM = (R+6)%7; // simulado semanal: véspera do descanso
  var cap = lessonCap(Number(p.hours));
  var pre = {};
  (p.preDone || []).forEach(function(id){ pre[id] = 1; });
  var f2 = p.fase2 ? F2_BY_ID[p.fase2] : null;
  var END = f2 ? P2 : P1;

  var order = F1; // a 1ª fase é igual para todos: mesma ordem de disciplinas do catálogo

  var allIds = [], preCount = 0;
  function mkItems(disc, name, phase){
    var list = [];
    disc.lessons.forEach(function(t, i){
      var id = disc.id+'-'+pad3(i+1);
      allIds.push(id);
      if(pre[id]){ preCount++; return; } // já concluída antes do plano começar
      list.push({id:id, disc:disc.id, discName:name, title:t, n:i+1, total:disc.lessons.length, phase:phase});
    });
    return list;
  }
  var queues = order.map(function(d, i){ var its = mkItems(d, d.name, 1); return {id:d.id, idx:i, items:its, n:its.length, done:0}; });
  var p1Items = [];
  queues.forEach(function(q){ p1Items = p1Items.concat(q.items); });
  var f2Name = f2 ? ('2ª fase · '+f2.name) : '';
  var p2Items = f2 ? mkItems(f2, f2Name, 2) : [];

  // Dias do plano: do início até a véspera da última prova, sem o dia de descanso
  var slots = [];
  for(var k = S; k < END; k = addDays(k,1)){
    if(k === P1) continue;
    var dow = keyToDate(k).getDay();
    if(dow === R) continue;
    slots.push({date:k, sim: dow===SIM, post: k>P1, f2:0, p1:0, review:null});
  }

  // 2ª fase: de 1 mês antes da 1ª fase até a véspera da 2ª. A matéria da 2ª fase tem dias
  // próprios (nunca divide o dia com a 1ª fase) e nunca cai em dois dias de estudo seguidos:
  // - antes da prova da 1ª fase: um dia de 1ª fase, um dia de 2ª fase, alternando;
  // - depois da prova da 1ª fase: um dia de aula, um dia de treino de peças, alternando.
  var f2Start = null;
  if(f2){
    f2Start = addMonths(P1, -1);
    if(f2Start < S) f2Start = S;
    var preWin = slots.filter(function(sl){ return !sl.post && !sl.sim && sl.date >= f2Start; });
    preWin.forEach(function(sl, i){ if(i % 2 === 1) sl.f2day = true; });
    var postWin = slots.filter(function(sl){ return sl.post; });
    // se o último dia de estudo antes da prova foi de 2ª fase, depois da prova começa com treino
    var lastPreStudy = slots.filter(function(sl){ return !sl.post && !sl.sim; }).pop();
    var offset = (lastPreStudy && lastPreStudy.f2day) ? 1 : 0;
    postWin.forEach(function(sl, i){ if((i + offset) % 2 === 0) sl.f2day = true; else sl.practice = true; });
    var f2Days = slots.filter(function(sl){ return sl.f2day; });
    var f2Counts = spread(p2Items.length, f2Days.map(function(){ return 1; }));
    f2Days.forEach(function(sl, i){ sl.f2 = f2Counts[i]; });
    // antes da prova, um dia reservado à 2ª fase que ficaria sem aula volta a ser dia de 1ª fase
    f2Days.forEach(function(sl){ if(!sl.post && sl.f2 === 0) sl.f2day = false; });
    f2Days = slots.filter(function(sl){ return sl.f2day; });
    // vizinhos (no calendário de estudo) de um dia de 2ª fase
    slots.forEach(function(sl, i){
      if((slots[i-1] && slots[i-1].f2day) || (slots[i+1] && slots[i+1].f2day)) sl.nearF2 = true;
    });
  }

  // 1ª fase: os últimos dias de estudo antes da prova viram revisões intensivas (uma por disciplina);
  // se as aulas não couberem no limite de horas, o número de revisões diminui.
  var studyPre = slots.filter(function(sl){ return !sl.post && !sl.sim && !sl.f2day; });
  function roomFor(list){ var c = 0; list.forEach(function(sl){ c += Math.max(0, cap - sl.f2); }); return c; }
  var K = Math.min(F1.length, studyPre.length);
  while(K > 0 && roomFor(studyPre.slice(0, studyPre.length-K)) < p1Items.length) K--;
  // Testa a distribuição real (um dia = uma disciplina): se algum dia passar do limite de
  // horas, troca um dia de revisão por um dia de conteúdo e tenta de novo.
  var contentSlots, reviewSlots, p1ByDay;
  function distribute(k){
    queues.forEach(function(q){ q.done = 0; });
    contentSlots = studyPre.slice(0, studyPre.length-k);
    reviewSlots = studyPre.slice(studyPre.length-k);
    var w = contentSlots.map(function(sl){ return Math.max(0, cap - sl.f2); });
    if(w.every(function(x){ return x===0; })) w = w.map(function(){ return 1; });
    var f2Twin = f2 ? f2.id.replace(/^f2-/, '') : null; // ex.: 2ª fase de Penal ⇔ Direito Penal da 1ª fase
    var forbid = contentSlots.map(function(sl){ var o = {}; if(f2Twin && sl.nearF2) o[f2Twin] = 1; return o; });
    p1ByDay = consolidateDays(interleaveFase1(queues, w, forbid));
    var fits = contentSlots.every(function(sl, i){ return p1ByDay[i].length + sl.f2 <= cap; });
    var single = p1ByDay.every(function(items){
      return items.every(function(it){ return it.disc === items[0].disc; });
    });
    return {fits: fits, single: single};
  }
  // Procura o maior número de revisões em que todo dia tenha uma só disciplina e caiba no
  // limite de horas; se não houver, fica com o maior que ao menos caiba no limite.
  // Prioridades: (1) uma disciplina por dia E dentro do limite de horas; (2) uma disciplina
  // por dia, mesmo passando do limite (plano apertado — o painel avisa); (3) dentro do limite.
  var chosen = -1, singleK = -1, fallbackK = -1;
  for(var k = Math.min(F1.length, studyPre.length); k >= 0; k--){
    if(k > K && chosen < 0 && singleK < 0) { var r0 = distribute(k); if(r0.fits && r0.single){ chosen = k; break; } continue; }
    var r = distribute(k);
    if(r.fits && fallbackK < 0) fallbackK = k;
    if(r.single && singleK < 0) singleK = k;
    if(r.fits && r.single){ chosen = k; break; }
  }
  K = chosen >= 0 ? chosen : (singleK >= 0 ? singleK : (fallbackK >= 0 ? fallbackK : 0));
  distribute(K);
  contentSlots.forEach(function(sl, i){ sl.p1 = p1ByDay[i].length; sl.p1Items = p1ByDay[i]; });

  var revDiscs = order.slice()
    .sort(function(a,b){ return b.lessons.length - a.lessons.length; }).slice(0, K)
    .sort(function(a,b){ return a.lessons.length - b.lessons.length; });
  // a primeira revisão não repete a disciplina do último dia de conteúdo
  var lastContent = contentSlots.length ? contentSlots[contentSlots.length-1].p1Items : [];
  var lastSet = {};
  lastContent.forEach(function(it){ lastSet[it.disc] = 1; });
  if(revDiscs.length > 1 && lastSet[revDiscs[0].id]){
    for(var r = 1; r < revDiscs.length; r++){
      if(!lastSet[revDiscs[r].id]){ var tmp = revDiscs[0]; revDiscs[0] = revDiscs[r]; revDiscs[r] = tmp; break; }
    }
  }
  // a revisão da matéria equivalente à da 2ª fase não pode ficar ao lado de um dia de 2ª fase
  if(f2){
    var twinId = f2.id.replace(/^f2-/, '');
    var ti = -1;
    revDiscs.forEach(function(d, i){ if(d.id === twinId) ti = i; });
    if(ti >= 0 && reviewSlots[ti] && reviewSlots[ti].nearF2){
      var swapped = false;
      for(var r2 = 0; r2 < reviewSlots.length; r2++){
        if(!reviewSlots[r2].nearF2 && !(r2 === 0 && lastSet[twinId])){
          var tmp2 = revDiscs[ti]; revDiscs[ti] = revDiscs[r2]; revDiscs[r2] = tmp2; swapped = true; break;
        }
      }
      // sem lugar longe dos dias de 2ª fase: essa revisão passa a ser de outra disciplina
      if(!swapped){
        var inRev = {};
        revDiscs.forEach(function(d){ inRev[d.id] = 1; });
        var sub = order.slice().sort(function(a,b){ return b.lessons.length - a.lessons.length; })
          .filter(function(d){ return !inRev[d.id] && d.id !== twinId && !(ti === 0 && lastSet[d.id]); })[0];
        if(sub) revDiscs[ti] = sub;
      }
    }
  }
  reviewSlots.forEach(function(sl, i){ sl.review = revDiscs[i]; });

  var days = [], p1Ptr = 0, p2Ptr = 0, maxLoad = 0, loadSum = 0, loadDays = 0;
  slots.forEach(function(sl){
    var items = (sl.p1Items || []).concat(p2Items.slice(p2Ptr, p2Ptr+sl.f2));
    p1Ptr += sl.p1; p2Ptr += sl.f2;
    var day;
    if(sl.review){
      day = {date:sl.date, type:'review', disc:sl.review.id, discName:sl.review.name, discTotal:sl.review.lessons.length, items:items};
    } else if(sl.sim || items.length===0){
      day = {date:sl.date, type:'simulado', practice: (sl.post || sl.f2day || sl.practice) ? 2 : 1, items:items};
    } else {
      day = {date:sl.date, type:'content', items:items};
    }
    if(items.length){ maxLoad = Math.max(maxLoad, items.length); loadSum += items.length; loadDays++; }
    days.push(day);
  });

  var disciplines = order.map(function(d){ return {id:d.id, name:d.name, total:d.lessons.length, phase:1}; });
  if(f2) disciplines.push({id:f2.id, name:f2Name, total:f2.lessons.length, phase:2});

  return {
    profile: p,
    days: days,
    disciplines: disciplines,
    allIds: allIds,
    preCount: preCount,
    meta: {
      examId: exam.id, examName: exam.name,
      editalAbertura: exam.editalAbertura, inscricoesInicio: exam.inscricoesInicio, inscricoesFim: exam.inscricoesFim,
      primeiraFase: P1, segundaFase: P2,
      startDate: S, endDate: END, f2Start: f2Start,
      p1Total: F1_TOTAL, f2Total: f2 ? f2.lessons.length : 0, f2Id: f2 ? f2.id : '', f2Name: f2 ? f2.name : '',
      simDow: SIM, restDow: R, hours: Number(p.hours)
    },
    stats: {cap: cap, maxLoad: maxLoad, avgLoad: loadDays ? loadSum/loadDays : 0, reviews: K, overCap: maxLoad > cap}
  };
}

function applyPlan(plan){
  PLAN = plan;
  PROFILE = plan.profile;
  META = plan.meta;
  DISCIPLINES = plan.disciplines;
  DISC_BY_ID = {};
  DISCIPLINES.forEach(function(d){ DISC_BY_ID[d.id] = d; });
  // mantém o nome de outras matérias de 2ª fase que apareçam em simulados antigos
  F2.forEach(function(d){
    if(!DISC_BY_ID[d.id]) DISC_BY_ID[d.id] = {id:d.id, name:'2ª fase · '+d.name, total:d.lessons.length, phase:2};
  });
  DAYS = plan.days;
  DAY_BY_DATE = {};
  DATE_LIST = [];
  DAYS.forEach(function(d){ DAY_BY_DATE[d.date] = d; DATE_LIST.push(d.date); });
  FIRST_DATE = META.startDate;
  LAST_DATE = META.endDate;
  LESSON_INDEX = {};
  DAYS.forEach(function(d){ d.items.forEach(function(it){ LESSON_INDEX[it.id] = it; it._date = d.date; }); });
  PLAN_LESSON_IDS = plan.allIds;
  _overdueCache = null;
}

/* ============ ESTADO (armazenado no servidor, por usuário, via /api/state) ============ */
var STORE_ENDPOINT = '/api/state';
var state = { lessons:{}, reviews:{}, simulados:{}, profile:null }; // populado após o primeiro carregamento do servidor
var currentUser = null; // { name, username } — vem de /api/me, /api/login ou /api/register
var appStarted = false;
var saveTimer = null;
var savePending = false;
var syncStatusEl = null;

// A sessão vive num cookie HttpOnly definido pelo servidor — nada de senha/token no localStorage.
function api(path, opts){
  opts = opts || {};
  var headers = {};
  for(var k in (opts.headers||{})) headers[k] = opts.headers[k];
  var body = opts.body;
  if(opts.json !== undefined){
    headers['Content-Type'] = 'application/json';
    body = JSON.stringify(opts.json);
  }
  return fetch(path, {method: opts.method || 'GET', headers: headers, body: body, credentials: 'same-origin', cache: 'no-store'});
}
function httpError(r){ var e = new Error('http_'+r.status); e.code = r.status; return e; }

function loadStateFromServer(){
  return api(STORE_ENDPOINT).then(function(r){
    if(!r.ok) throw httpError(r);
    return r.json();
  }).then(function(data){
    state = {
      lessons: (data && data.lessons) || {},
      reviews: (data && data.reviews) || {},
      simulados: (data && data.simulados) || {},
      profile: (data && data.profile) || null
    };
    return state;
  });
}

function saveState(){
  clearTimeout(saveTimer);
  savePending = true;
  setSyncStatus('pending');
  saveTimer = setTimeout(pushState, 400);
}
// Envia o estado agora (usado pelo saveState com atraso e antes de sair da conta).
function pushState(){
  clearTimeout(saveTimer);
  saveTimer = null;
  return api(STORE_ENDPOINT, {method:'POST', json: state}).then(function(r){
    if(r.status===401){
      setSyncStatus('error');
      showAuthScreen('login', 'Sua sessão expirou. Entre de novo para continuar salvando.');
      return;
    }
    if(!r.ok) throw httpError(r);
    savePending = false;
    setSyncStatus('ok');
  }).catch(function(){
    setSyncStatus('error');
  });
}
function setSyncStatus(kind){
  if(!syncStatusEl) syncStatusEl = document.getElementById('sync-status');
  if(!syncStatusEl) return;
  if(kind==='pending') syncStatusEl.textContent = 'Salvando no servidor…';
  else if(kind==='ok') syncStatusEl.textContent = 'Salvo no servidor';
  else if(kind==='error') syncStatusEl.textContent = 'Não foi possível salvar — verifique sua conexão';
  syncStatusEl.className = 'sync-status '+kind;
}

/* ============ ANEXOS DOS SIMULADOS (guardados no servidor, via /api/files) ============ */
var MAX_FILE_BYTES = 4*1024*1024;
function fileUrl(id){ return '/api/files?id='+encodeURIComponent(id); }
function fileProblem(f){
  var ext = (f.name.split('.').pop() || '').toLowerCase();
  if(['pdf','doc','docx'].indexOf(ext) < 0) return 'Envie um arquivo PDF, DOC ou DOCX.';
  if(f.size > MAX_FILE_BYTES) return 'O arquivo tem '+(Math.round(f.size/1024/1024*10)/10).toString().replace('.', ',')+' MB e o limite é 4 MB. Tente comprimir o PDF antes de anexar.';
  return null;
}
function fileErrorMessage(err){
  var code = err && err.message;
  if(code==='too_large') return 'O arquivo passa do limite de 4 MB.';
  if(code==='invalid_type') return 'Envie um arquivo PDF, DOC ou DOCX.';
  if(err && err.code===401) return 'Sua sessão expirou. Entre de novo para anexar o arquivo.';
  return 'Não foi possível enviar o arquivo. Verifique sua internet e tente de novo.';
}
function uploadFile(body, name, type){
  return fetch('/api/files', {
    method: 'POST',
    headers: {'Content-Type': type || 'application/octet-stream', 'X-File-Name': encodeURIComponent(name)},
    body: body,
    credentials: 'same-origin'
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(d){
      if(!r.ok){ var e = new Error(d.error || (r.status===413 ? 'too_large' : 'http_'+r.status)); e.code = r.status; throw e; }
      return d.file;
    });
  });
}
function discardFile(meta){
  if(!meta) return;
  if(meta.fileId) api(fileUrl(meta.fileId), {method:'DELETE'}).catch(function(){});
  if(meta.blobKey) idbDelete(meta.blobKey);
}
// Envia para o servidor um anexo antigo que estava só neste navegador. Resolve true se conseguiu.
function migrateEntryFile(entry){
  var meta = entry && entry.fileMeta;
  if(!meta || meta.fileId || !meta.blobKey) return Promise.resolve(false);
  return idbGet(meta.blobKey).then(function(blob){
    if(!blob) return false;
    return uploadFile(blob, meta.name, meta.type).then(function(file){
      var oldKey = meta.blobKey;
      entry.fileMeta = {name:file.name, type:file.type, size:file.size, fileId:file.id};
      idbDelete(oldKey);
      return true;
    });
  }).catch(function(){ return false; });
}
// Ao entrar, procura anexos antigos deste navegador e envia todos para o servidor.
function migrateLocalFiles(){
  var pending = [];
  Object.keys(state.simulados).forEach(function(dt){
    (state.simulados[dt] || []).forEach(function(e){
      if(e && e.fileMeta && e.fileMeta.blobKey && !e.fileMeta.fileId) pending.push(e);
    });
  });
  if(!pending.length) return;
  var changed = false;
  pending.reduce(function(chain, e){
    return chain.then(function(){ return migrateEntryFile(e).then(function(ok){ if(ok) changed = true; }); });
  }, Promise.resolve()).then(function(){
    if(changed){ saveState(); renderCurrentView(); }
  });
}

/* ============ IndexedDB (só para anexos antigos, de antes da mudança para o servidor) ============ */
var idbPromise = null;
function getDB(){
  if(idbPromise) return idbPromise;
  idbPromise = new Promise(function(resolve, reject){
    if(!window.indexedDB){ reject('sem indexeddb'); return; }
    var req = indexedDB.open('oabPlanoFiles', 1);
    req.onupgradeneeded = function(){ req.result.createObjectStore('files'); };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
  return idbPromise;
}
function idbPut(key, blob){
  return getDB().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction('files','readwrite');
      tx.objectStore('files').put(blob, key);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}
function idbGet(key){
  return getDB().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction('files','readonly');
      var r = tx.objectStore('files').get(key);
      r.onsuccess = function(){ resolve(r.result); };
      r.onerror = function(){ reject(r.error); };
    });
  });
}
function idbDelete(key){
  return getDB().then(function(db){
    return new Promise(function(resolve){
      var tx = db.transaction('files','readwrite');
      tx.objectStore('files').delete(key);
      tx.oncomplete = function(){ resolve(); };
    });
  }).catch(function(){});
}

/* ============ HELPERS DE PROGRESSO ============ */
function isLessonDone(id){ return !!(state.lessons[id] && state.lessons[id].done); }
function setLessonDone(id, done){
  state.lessons[id] = { done: done, ts: done ? todayKey() : (state.lessons[id]?state.lessons[id].ts:null) };
  saveState();
  _overdueCache = null;
}
function totalDoneCount(){
  var c = 0;
  PLAN_LESSON_IDS.forEach(function(id){ if(isLessonDone(id)) c++; });
  return c;
}
function phaseDoneCount(phase){
  var c = 0;
  PLAN_LESSON_IDS.forEach(function(id){
    if((id.indexOf('f2-')===0 ? 2 : 1) === phase && isLessonDone(id)) c++;
  });
  return c;
}
function disciplineDoneCount(discId){
  var d = DISC_BY_ID[discId];
  if(!d) return 0;
  var c = 0;
  for(var i=1;i<=d.total;i++){ if(isLessonDone(discId+'-'+pad3(i))) c++; }
  return c;
}
function dayDoneCount(day){
  if(!day.items) return 0;
  var c = 0;
  day.items.forEach(function(it){ if(isLessonDone(it.id)) c++; });
  return c;
}
function isReviewDone(dateKey){ return !!(state.reviews[dateKey] && state.reviews[dateKey].done); }
function computeSimStats(){
  var byDisc = {}; // discId -> {q,a,e}
  var overall = {q:0,a:0,e:0};
  var count = 0;
  DISCIPLINES.forEach(function(d){ byDisc[d.id] = {q:0,a:0,e:0}; });
  var semDisc = {q:0,a:0,e:0};
  Object.keys(state.simulados).forEach(function(dt){
    (state.simulados[dt]||[]).forEach(function(rawEntry){
      var entry = normalizeSimEntry(rawEntry);
      count++;
      entry.rows.forEach(function(row){
        var q = Number(row.questoes)||0, a = Number(row.acertos)||0, e = Number(row.erros)||0;
        if(q===0 && a===0 && e===0) return;
        overall.q += q; overall.a += a; overall.e += e;
        if(row.disc && byDisc[row.disc]){
          byDisc[row.disc].q += q; byDisc[row.disc].a += a; byDisc[row.disc].e += e;
        } else {
          semDisc.q += q; semDisc.a += a; semDisc.e += e;
        }
      });
    });
  });
  return {overall:overall, byDisc:byDisc, semDisc:semDisc, count:count};
}
function isDayFullyDone(day){
  var itemsDone = dayDoneCount(day) === day.items.length;
  if(day.type === 'content') return day.items.length>0 && itemsDone;
  if(day.type === 'review') return isReviewDone(day.date) && itemsDone;
  if(day.type === 'simulado') return !!(state.simulados[day.date] && state.simulados[day.date].length>0) && itemsDone;
  return false;
}

/* ============ PENDÊNCIAS (aulas de dias já passados e não concluídas) ============ */
var _overdueCache = null;
var _overdueCacheDay = null;
function matterOf(discId){ return String(discId).replace(/^f2-/, ''); }
function dayMatters(d){
  var ids = {};
  d.items.forEach(function(it){ ids[matterOf(it.disc)] = 1; });
  if(d.type==='review') ids[matterOf(d.disc)] = 1;
  return ids;
}
function dayDiscIds(d){
  var ids = {};
  d.items.forEach(function(it){ ids[it.disc] = 1; });
  if(d.type==='review') ids[d.disc] = 1;
  return ids;
}
// Aulas pendentes (de dias já passados) são repostas no próximo dia de estudo da PRÓPRIA
// disciplina — assim nenhum dia ganha uma segunda matéria e nenhuma matéria cai em dias
// seguidos. Se forem muitas, dividem-se pelos próximos dias dessa disciplina.
// Só quando a disciplina não tem mais nenhum dia pela frente, a reposição vai para o
// primeiro dia cujos dias vizinhos não sejam dessa disciplina.
function computeOverdueMakeups(){
  if(_overdueCache && _overdueCacheDay===todayK) return _overdueCache;

  var overdueByDisc = {}, order = [];
  DAYS.forEach(function(d){
    if(d.date < todayK){
      d.items.forEach(function(it){
        if(!isLessonDone(it.id)){
          if(!overdueByDisc[it.disc]){ overdueByDisc[it.disc] = []; order.push(it.disc); }
          overdueByDisc[it.disc].push({item:it, originalDate:d.date});
        }
      });
    }
  });

  var future = DATE_LIST.filter(function(dk){ return dk >= todayK; }).map(function(dk){ return DAY_BY_DATE[dk]; });
  var futureByDisc = {};
  future.forEach(function(d){
    var ids = dayDiscIds(d);
    for(var id in ids){ (futureByDisc[id] = futureByDisc[id] || []).push(d.date); }
  });
  var cap = PLAN ? PLAN.stats.cap : 4;

  var byDate = {}, flatList = [];
  function place(entry, dk){
    if(dk){ (byDate[dk] = byDate[dk] || []).push(entry); }
    flatList.push({item:entry.item, originalDate:entry.originalDate, targetDate:dk || null});
  }
  order.forEach(function(disc){
    var entries = overdueByDisc[disc];
    var targets = futureByDisc[disc] || [];
    if(targets.length){
      var t = 0;
      entries.forEach(function(entry){
        // avança para o próximo dia da disciplina se este já estiver cheio
        while(t < targets.length-1){
          var d = DAY_BY_DATE[targets[t]];
          var load = d.items.length + (byDate[targets[t]] || []).length;
          if(load < Math.max(cap, d.items.length+1)) break;
          t++;
        }
        place(entry, targets[t]);
      });
    } else {
      var isF1 = disc.indexOf('f2-') !== 0;
      if(isF1 && todayK >= META.primeiraFase){ entries.forEach(function(entry){ place(entry, null); }); return; }
      function neighborsFree(i){
        var prev = i>0 ? future[i-1] : DAY_BY_DATE[DATE_LIST[DATE_LIST.indexOf(future[0].date)-1]];
        var next = future[i+1];
        var pm = prev ? dayMatters(prev) : {}, nm = next ? dayMatters(next) : {};
        (byDate[prev && prev.date] || []).forEach(function(e){ pm[matterOf(e.item.disc)] = 1; });
        (byDate[next && next.date] || []).forEach(function(e){ nm[matterOf(e.item.disc)] = 1; });
        return !pm[matterOf(disc)] && !nm[matterOf(disc)];
      }
      var limit = isF1 ? META.primeiraFase : META.endDate;
      var pick = null;
      // 1º) um dia de questões ainda sem matéria (a reposição vira a matéria única do dia)
      for(var i=0;i<future.length && !pick;i++){
        var d = future[i];
        if(d.date >= limit) break;
        if(d.type==='simulado' && !d.items.length && !(byDate[d.date]||[]).length && neighborsFree(i)) pick = d.date;
      }
      // 2º) senão, um dia de conteúdo da 1ª fase que ainda não recebeu nenhuma reposição
      //     (fica com no máximo 2 matérias), com vizinhos sem essa disciplina
      for(var j=0;j<future.length && !pick;j++){
        var dj = future[j];
        if(dj.date >= limit) break;
        var ownF2 = dj.items.some(function(it){ return it.phase===2; });
        if(dj.type!=='review' && !ownF2 && !(byDate[dj.date]||[]).length && neighborsFree(j)) pick = dj.date;
      }
      // 3º) último recurso: o dia (com vizinhos livres) que tiver menos reposições de outras
      //     disciplinas — espalha as pendências, uma matéria extra por dia sempre que possível
      if(!pick){
        var bestLoad = Infinity;
        for(var q=0;q<future.length;q++){
          if(future[q].date >= limit) break;
          if(!neighborsFree(q)) continue;
          var others = {};
          (byDate[future[q].date]||[]).forEach(function(e){ others[e.item.disc] = 1; });
          var n = Object.keys(others).length;
          if(n < bestLoad){ bestLoad = n; pick = future[q].date; if(n === 0) break; }
        }
      }
      entries.forEach(function(entry){ place(entry, pick); });
    }
  });
  flatList.sort(function(a,b){ return a.originalDate < b.originalDate ? -1 : (a.originalDate > b.originalDate ? 1 : 0); });

  _overdueCache = {byDate:byDate, flatList:flatList};
  _overdueCacheDay = todayK;
  return _overdueCache;
}

  todayK = todayKey();
  var k = DAY_BY_DATE[todayK] ? todayK : nearestStudyDate(todayK);
  ui.dailyDate = k;

function nearestStudyDate(key){
  key = clampKey(key);
  if(DAY_BY_DATE[key]) return key;
  var k = key;
  for(var i=0;i<10;i++){
    k = addDays(k,1);
    if(k>LAST_DATE) break;
    if(DAY_BY_DATE[k]) return k;
  }
  return FIRST_DATE;
}

  if(META.f2Id && todayK > META.primeiraFase) return {date: META.segundaFase, phase: 2};
  return {date: META.primeiraFase, phase: 1};
}
function renderPainel(){
  var el = document.getElementById('view-painel');
  var total = PLAN_LESSON_IDS.length;
  var done = totalDoneCount();
  var pct = total ? Math.round(done/total*1000)/10 : 0;

  // Esperado: tudo de dias anteriores + o que já foi feito hoje (as aulas de hoje só contam como atraso amanhã)
  var expected = PLAN.preCount;
  DAYS.forEach(function(d){
    if(d.date < todayK) expected += d.items.length;
    else if(d.date === todayK) expected += dayDoneCount(d);
  });
  var delta = done - expected;
  var andamentoTxt, andamentoClass = '';
  if(todayK < FIRST_DATE){
    andamentoTxt = 'Plano ainda não iniciado';
  } else if(delta >= 0){
    andamentoTxt = delta===0 ? 'Em dia com o plano' : (delta+' aula'+(delta===1?'':'s')+' à frente do plano');
  } else {
    andamentoTxt = (-delta)+' aula'+(delta===-1?'':'s')+' atrás do plano';
    andamentoClass = 'atraso';
  }

  var streak = computeStreak();
  var simStats = computeSimStats();
  var mediaAcerto = simStats.overall.q>0 ? Math.round(simStats.overall.a/simStats.overall.q*1000)/10 : null;

  var evolDays = [];
  for(var i=13;i>=0;i--){ evolDays.push(addDays(todayK, -i)); }

    for(var id in state.lessons){ if(state.lessons[id].done && state.lessons[id].ts===dk) c++; }

  var maxC = Math.max.apply(null, counts.concat([1]));

  var overdue = computeOverdueMakeups();

  var p1Discs = DISCIPLINES.filter(function(d){ return d.phase===1; });

    phaseCards =
      statCard('1ª fase', p1d+'<small> /'+META.p1Total+'</small>', Math.round(p1d/META.p1Total*100)+'% das aulas concluídas')+
      statCard('2ª fase · '+META.f2Name, p2d+'<small> /'+META.f2Total+'</small>', 'aulas a partir de '+fmtDateShort(META.f2Start));
  } else {
    phaseCards = statCard('Disciplinas', p1Discs.length, p1Discs.filter(function(d){ return disciplineDoneCount(d.id)===d.total; }).length+' concluídas');
  }

  var target = countdownTarget();

  el.innerHTML =
    '<div class="painel-head">'+
      '<div>'+
        '<h2 class="view-title">Painel do plano</h2>'+
        '<p class="view-sub">Acompanhamento geral da sua preparação para o '+escapeHtml(META.examName)+'.</p>'+
      '</div>'+
      '<p class="ebradi-note"><strong>Sincronizado com a EBRADI.</strong> Todas as aulas deste cronograma seguem o conteúdo programático do curso preparatório da EBRADI, com os mesmos títulos e a mesma sequência dentro de cada disciplina.</p>'+
    '</div>'+
    '<div class="prazo-fatal">'+
      '<div><div class="pf-label">Contagem regressiva · '+(target.phase===2 ? '2ª fase' : '1ª fase')+'</div>'+
      '<div style="font-size:14px;">'+escapeHtml(fmtDateLong(target.date))+
        (target.phase===1 && META.f2Id ? ' <span style="opacity:.8">(2ª fase: '+escapeHtml(fmtDateLong(META.segundaFase))+')</span>' : '')+'</div>'+
      '<div class="pf-sub">'+andamentoBadge(andamentoTxt, andamentoClass)+'</div></div>'+
      '<div class="pf-count" id="pf-count"></div>'+
    '</div>'+
    '<div class="dash-grid">'+
      statCard('Progresso geral', pct+'<small>%</small>', done+' de '+total+' aulas concluídas')+
      phaseCards+
      statCard('Sequência atual', streak+'<small> dia'+(streak===1?'':'s')+'</small>', 'de estudo completo, sem falhas')+
      statCard('Simulados registrados', simStats.count, mediaAcerto!==null ? ('aproveitamento geral: '+mediaAcerto+'%') : 'nenhum resultado ainda')+
      statCard('Aulas pendentes', pendingCount, pendingCount>0 ? 'clique para ver a lista e repor' : 'nenhuma pendência — em dia', 'stat-pendentes')+
    '</div>'+
    '<div class="progress-outer"><div class="progress-inner" style="width:'+pct+'%"></div></div>'+
    '<div class="section-block">'+
      '<h3>Evolução diária <span class="h3-note">· últimos 14 dias</span></h3>'+
      '<div class="evol-chart">'+counts.map(function(c){
        var h = c>0 ? Math.max(4,Math.round(c/maxC*70)) : 0;
        return '<div class="evol-bar" title="'+c+' aula(s)"><div class="fill" style="height:'+h+'px"></div></div>';
      }).join('')+'</div>'+
      '<div class="evol-labels">'+evolDays.map(function(d,i){ return (i%2===0)?('<span>'+fmtDateShort(d)+'</span>'):'<span></span>'; }).join('')+'</div>'+
    '</div>'+
    '<div class="section-block">'+
      '<h3>Andamento por disciplina <span class="h3-note">· aulas concluídas</span></h3>'+
      '<div class="disc-list">'+p1Discs.map(discRow).join('')+'</div>'+
      (f2Disc ? '<div class="disc-list" style="margin-top:14px;">'+discRow(f2Disc)+'</div>' : '')+
    '</div>'+
    '<div class="painel-cols">'+
      '<div class="section-block">'+

  updateCountdownEl(document.getElementById('pf-count'));
  var pendCard = el.querySelector('.stat-pendentes');
  if(pendCard){ pendCard.onclick = function(){ switchTab('pendentes'); }; }
  var adj = document.getElementById('plan-adjust');
  if(adj){ adj.onclick = function(){ showOnboarding(true); }; }
}

function computeStreak(){
  var relevant = DATE_LIST.filter(function(k){
    var d = DAY_BY_DATE[k];
    return (d.type==='content' || d.type==='review') && k <= todayK;
  }).sort().reverse();
  var streak = 0;
  for(var i=0;i<relevant.length;i++){
    var d = DAY_BY_DATE[relevant[i]];
    if(isDayFullyDone(d)) streak++;
    else break;
  }
  return streak;
}

/* countdown */
function updateCountdownEl(container){
  if(!container) return;
  var target = keyToDate(countdownTarget().date).getTime();
  var now = new Date().getTime();
  var diff = Math.max(0, target-now);
  var d = Math.floor(diff/86400000);
  var h = Math.floor(diff/3600000)%24;
  var m = Math.floor(diff/60000)%60;
  var s = Math.floor(diff/1000)%60;
  container.innerHTML =
    cbox(d,'dias')+cbox(pad2(h),'horas')+cbox(pad2(m),'min')+cbox(pad2(s),'seg');
}
function cbox(n,u){ return '<div><span class="n">'+n+'</span><span class="u">'+u+'</span></div>'; }

    '<div class="section-block">'+
      '<h3>Aproveitamento por disciplina</h3>'+
      '<div class="sim-stat-list">'+renderSimDiscRows(simStats)+'</div>'+
    '</div>'+
    (histHtml ? (
      '<div class="section-block">'+
        '<h3>Histórico de registros</h3>'+

/* ============ RENDER: PENDENTES ============ */
function renderPendentes(){
  var el = document.getElementById('view-pendentes');
  var overdue = computeOverdueMakeups();
  var list = overdue.flatList;

  var head = '<h2 class="view-title">Aulas pendentes</h2>'+
    '<p class="view-sub">Aulas de dias já passados que ainda não foram marcadas como concluídas'+
    (list.length>0 ? ', repostas no próximo dia de estudo da mesma disciplina.' : '.')+'</p>';

  if(list.length===0){
    el.innerHTML = head + '<div class="rest-note"><span class="big">Tudo em dia</span>Nenhuma aula pendente no momento — continue assim!</div>';
    return;
  }

  var rows = list.map(function(entry){
    var it = entry.item;
    var navDate = entry.targetDate || entry.originalDate;
    return '<div class="pend-row">'+
      '<input type="checkbox" data-lesson="'+it.id+'">'+
      '<div class="pend-body">'+
        '<div class="li-disc">'+escapeHtml(it.discName)+'</div>'+
        '<div class="li-title">'+escapeHtml(it.title)+'</div>'+
        '<div class="pend-dates">'+
          '<span class="pend-orig">pendente desde '+fmtDateShort(entry.originalDate)+'</span>'+
          (entry.targetDate ? ('<span class="pend-target">→ reposição em '+fmtDateShort(entry.targetDate)+'</span>') : '<span class="pend-target">'+(todayK >= META.primeiraFase && it.phase===1 ? 'a prova da 1ª fase já passou' : 'sem data de reposição definida')+'</span>')+
        '</div>'+
      '</div>'+
      '<button type="button" class="btn-mini pend-open" data-date="'+navDate+'">abrir dia</button>'+
    '</div>';
  }).join('');

  el.innerHTML = head + '<div class="pend-list">'+rows+'</div>';

  Array.prototype.forEach.call(el.querySelectorAll('[data-lesson]'), function(cb){
    cb.onchange = function(){
      setLessonDone(cb.getAttribute('data-lesson'), true);
