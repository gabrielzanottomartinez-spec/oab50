/* ============ RENDER: DIÁRIO ============ */
function lessonItemHtml(it, badge){
  var done = isLessonDone(it.id);
  return '<div class="lesson-item'+(done?' done':'')+(badge?' overdue':'')+(it.phase===2?' f2':'')+'">'+
    '<input type="checkbox" data-lesson="'+it.id+'" '+(done?'checked':'')+' aria-label="Concluir: '+escapeHtml(it.title)+'">'+
    '<div class="li-body">'+
      '<div class="li-disc">'+escapeHtml(it.discName)+(badge?' <span class="pending-badge">'+escapeHtml(badge)+'</span>':'')+'</div>'+
      '<div class="li-title">'+escapeHtml(it.title)+'</div>'+
      '<div class="li-meta">Aula '+it.n+' de '+it.total+'</div>'+
    '</div></div>';
}
function dayLessonsHtml(day, key){
  var dc = dayDoneCount(day);
  var isPast = key < todayK;
  return '<div class="day-summary-bar"><div class="progress-outer"><div class="progress-inner" style="width:'+Math.round(dc/day.items.length*100)+'%"></div></div>'+
      '<div class="txt">'+dc+'/'+day.items.length+'</div></div>'+
    '<div class="lesson-list">'+day.items.map(function(it){
      return lessonItemHtml(it, (isPast && !isLessonDone(it.id)) ? 'pendente' : '');
    }).join('')+'</div>';
}
function renderDiario(){
  var el = document.getElementById('view-diario');
  var key = ui.dailyDate;
  var day = DAY_BY_DATE[key];
  var dt = keyToDate(key);
  var dow = dt.getDay();

  var head =
    '<div class="day-nav">'+
      '<div class="nav-btns">'+
        '<button class="iconbtn" id="daily-prev" aria-label="Dia anterior">‹</button>'+
        '<button class="iconbtn" id="daily-next" aria-label="Próximo dia">›</button>'+
        '<button class="today-btn" id="daily-today">Hoje</button>'+
      '</div>'+
      '<div class="day-date-big"><span class="dow">'+DOW_NAMES[dow]+'</span>'+fmtDateLong(key)+'</div>'+
      '<input type="date" class="daypick" id="daily-pick" value="'+key+'" min="'+FIRST_DATE+'" max="'+LAST_DATE+'" aria-label="Escolher data">'+
    '</div>';

  var overdue = computeOverdueMakeups();
  var makeupItems = overdue.byDate[key] || [];

  var body = '';
  if(key === META.primeiraFase){
    body = '<div class="rest-note"><span class="big">Dia da prova · 1ª fase</span>É hoje. Confie na preparação que você construiu, aula por aula. Boa prova!'+
      (META.f2Id ? '<br>Depois dela, o cronograma segue com '+escapeHtml(META.f2Name)+' até a 2ª fase.' : '')+'</div>';
  } else if(META.f2Id && key === META.segundaFase){
    body = '<div class="rest-note"><span class="big">Dia da prova · 2ª fase</span>Hoje é a prova prático-profissional de '+escapeHtml(META.f2Name)+'. Leia o enunciado com calma e confie na estrutura da peça. Boa prova!</div>';
  } else if(!day){
    body = key < FIRST_DATE
      ? '<div class="rest-note"><span class="big">Antes do início do plano</span>Seu cronograma começa em '+fmtDateLong(FIRST_DATE)+'.</div>'
      : '<div class="rest-note"><span class="big">Dia de descanso</span>Sem aulas nem revisões programadas. Aproveite para recarregar as energias.</div>';
  } else {
    if(day.type==='review'){
      var rv = state.reviews[key] || {done:false, notes:''};
      body += '<div class="review-card">'+
        '<h3>Revisão intensiva · '+escapeHtml(day.discName)+'</h3>'+
        '<p>Dia reservado para revisar, de ponta a ponta, as '+day.discTotal+' aulas de '+escapeHtml(day.discName)+'. Releia anotações, refaça pontos de dúvida e destaque o que precisa de reforço.</p>'+
        '<div class="review-check"><input type="checkbox" id="review-check" '+(rv.done?'checked':'')+'><label for="review-check">Revisão concluída</label></div>'+
        '<textarea class="notes" id="review-notes" placeholder="Anotações da revisão (pontos fracos, tópicos para reforçar)..." aria-label="Anotações da revisão">'+escapeHtml(rv.notes||'')+'</textarea>'+
      '</div>';
    } else if(day.type==='simulado'){
      body += renderSimuladoDay(key, day);
    }
    if(day.items.length){
      if(day.type!=='content') body += '<h3 class="day-sub">Aulas do dia</h3>';
      body += dayLessonsHtml(day, key);
    }
  }

  if(makeupItems.length>0){
    body += '<div class="makeup-block">'+
      '<h3 class="makeup-title">Reposições alocadas para este dia</h3>'+
      '<p class="makeup-sub">Aulas de dias já passados que ainda não foram concluídas, repostas no próximo dia da mesma disciplina.</p>'+
      '<div class="lesson-list">'+
      makeupItems.map(function(entry){ return lessonItemHtml(entry.item, 'pendente desde '+fmtDateShort(entry.originalDate)); }).join('')+
      '</div>'+
    '</div>';
  }

  el.innerHTML = head + body;
  bindDailyEvents(key, day);
}

function renderSimuladoDay(key, day){
  var entries = (state.simulados[key] || []).map(normalizeSimEntry);
  var practice2 = day && day.practice===2;
  var html = '<div class="simulado-wrap" data-date="'+key+'">'+
    (practice2
      ? '<h3>Treino para a 2ª fase</h3><p>Dia de prática: redija uma peça ou resolva questões discursivas de '+escapeHtml(META.f2Name)+'. Se quiser acompanhar o desempenho, anexe o arquivo e registre o resultado.</p>'
      : '<h3>Questões &amp; simulados</h3><p>Anexe o arquivo do simulado ou da lista de questões e, em seguida, informe o resultado por disciplina para acompanhar seu aproveitamento.</p>')+
    '<div class="sim-entries">';
  entries.forEach(function(entry, idx){ html += renderSimEntry(key, entry, idx); });
  html += '</div><button type="button" class="btn-add sim-add">+ Adicionar simulado/lista de questões</button></div>';
  return html;
}
function normalizeSimEntry(e){
  if(!e.rows){
    e.rows = [{disc:'', questoes:(e.questoes!==undefined?e.questoes:''), acertos:(e.acertos!==undefined?e.acertos:''), erros:(e.erros!==undefined?e.erros:'')}];
  }
  if(!e.rows.length){ e.rows.push({disc:'',questoes:'',acertos:'',erros:''}); }
  delete e.disciplinas; delete e.questoes; delete e.acertos; delete e.erros;
  return e;
}
function discOptions(selected){
  var out = '<option value=""'+(!selected?' selected':'')+'>Selecione a disciplina…</option>';
  DISCIPLINES.forEach(function(d){
    out += '<option value="'+d.id+'"'+(selected===d.id?' selected':'')+'>'+escapeHtml(d.name)+'</option>';
  });
  return out;
}
function entryTotals(entry){
  var q=0,a=0,e=0;
  entry.rows.forEach(function(r){ q += Number(r.questoes)||0; a += Number(r.acertos)||0; e += Number(r.erros)||0; });
  return {q:q,a:a,e:e, pct: q>0 ? Math.round(a/q*1000)/10 : null};
}
function renderSimEntry(dateKey, entry, idx){
  var tot = entryTotals(entry);
  var rowsHtml = entry.rows.map(function(row, ridx){
    var rpct = (row.questoes && Number(row.questoes)>0) ? Math.round((Number(row.acertos)||0)/Number(row.questoes)*100) : null;
    return '<div class="sim-row" data-ridx="'+ridx+'">'+
      '<select class="sim-disc">'+discOptions(row.disc)+'</select>'+
      '<input type="number" min="0" class="sim-q" placeholder="Questões" value="'+(row.questoes!==undefined?row.questoes:'')+'">'+
      '<input type="number" min="0" class="sim-a" placeholder="Acertos" value="'+(row.acertos!==undefined?row.acertos:'')+'">'+
      '<input type="number" min="0" class="sim-e" placeholder="Erros" value="'+(row.erros!==undefined?row.erros:'')+'">'+
      '<span class="sim-row-pct">'+(rpct!==null?(rpct+'%'):'—')+'</span>'+
      (entry.rows.length>1 ? '<button type="button" class="row-remove" title="Remover disciplina" aria-label="Remover disciplina">×</button>' : '<span></span>')+
    '</div>';
  }).join('');

  return '<div class="sim-entry" data-idx="'+idx+'">'+
    '<div class="sim-file">'+
      '<span class="fname">'+(entry.fileMeta ? escapeHtml(entry.fileMeta.name)+(entry.fileMeta.fileId ? '' : ' <em>(salvo só no navegador onde foi anexado)</em>') : 'Nenhum arquivo anexado')+'</span>'+
      '<span style="display:flex;gap:10px;flex-shrink:0;">'+
        (entry.fileMeta ? '<a href="#" class="btn-mini sim-open">abrir</a>' : '')+
        '<label class="btn-mini">'+(entry.fileMeta ? 'trocar arquivo' : 'anexar arquivo do simulado')+'<input type="file" accept=".pdf,.doc,.docx" class="sim-file-input" style="display:none"></label>'+
      '</span>'+
    '</div>'+
    '<div class="sim-rows-head"><span>Disciplina</span><span>Questões</span><span>Acertos</span><span>Erros</span><span>%</span><span></span></div>'+
    '<div class="sim-rows">'+rowsHtml+'</div>'+
    '<button type="button" class="btn-add-row">+ adicionar disciplina a este simulado</button>'+
    '<div class="sim-stats">'+
      '<div class="sim-stats-main">Aproveitamento geral deste simulado: <strong>'+(tot.pct!==null?(tot.pct+'%'):'—')+'</strong>'+
      (tot.q>0 ? (' <span class="sim-stats-sub">('+tot.a+' acertos de '+tot.q+' questões, '+tot.e+' erros)</span>') : '')+
      '</div>'+
    '</div>'+
    '<div class="sim-actions"><span></span><button type="button" class="btn danger sim-remove">Remover este registro</button></div>'+
  '</div>';
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function escapeAttr(s){ return escapeHtml(s); }

function bindDailyEvents(key, day){
  document.getElementById('daily-prev').onclick = function(){ ui.dailyDate = clampKey(addDays(key,-1)); renderDiario(); };
  document.getElementById('daily-next').onclick = function(){ ui.dailyDate = clampKey(addDays(key,1)); renderDiario(); };
  document.getElementById('daily-today').onclick = function(){ ui.dailyDate = clampKey(todayK); renderDiario(); };
  document.getElementById('daily-pick').onchange = function(e){ ui.dailyDate = clampKey(e.target.value); renderDiario(); };

  Array.prototype.forEach.call(document.querySelectorAll('#view-diario [data-lesson]'), function(cb){
    cb.onchange = function(){
      setLessonDone(cb.getAttribute('data-lesson'), cb.checked);
      renderDiario();
    };
  });

  if(!day) return;

  if(day.type==='review'){
    var chk = document.getElementById('review-check');
    var notes = document.getElementById('review-notes');
    chk.onchange = function(){
      state.reviews[key] = state.reviews[key] || {};
      state.reviews[key].done = chk.checked;
      saveState();
    };
    var notesTimer = null;
    notes.oninput = function(){
      clearTimeout(notesTimer);
      notesTimer = setTimeout(function(){
        state.reviews[key] = state.reviews[key] || {};
        state.reviews[key].notes = notes.value;
        saveState();
      }, 300);
    };
  } else if(day.type==='simulado'){
    var container = document.getElementById('view-diario').querySelector('.simulado-wrap');
    bindSimuladoEvents(container, key, renderDiario);
  }
}

/* container: the .simulado-wrap element; key: date; onChange: called to re-render the host view after structural changes */
function bindSimuladoEvents(container, key, onChange){
  if(!container) return;
  var addBtn = container.querySelector('.sim-add');
  if(addBtn){
    addBtn.onclick = function(){
      state.simulados[key] = state.simulados[key] || [];
      state.simulados[key].push({rows:[{disc:'',questoes:'',acertos:'',erros:''}]});
      saveState();
      onChange();
    };
  }
  Array.prototype.forEach.call(container.querySelectorAll('.sim-entry'), function(entryEl){
    var idx = parseInt(entryEl.getAttribute('data-idx'),10);
    function entry(){ return state.simulados[key][idx]; }

    var addRowBtn = entryEl.querySelector('.btn-add-row');
    if(addRowBtn){
      addRowBtn.onclick = function(){
        entry().rows.push({disc:'',questoes:'',acertos:'',erros:''});
        saveState();
        onChange();
      };
    }

    Array.prototype.forEach.call(entryEl.querySelectorAll('.sim-row'), function(rowEl){
      var ridx = parseInt(rowEl.getAttribute('data-ridx'),10);
      function row(){ return entry().rows[ridx]; }
      var selEl = rowEl.querySelector('.sim-disc');
      var qEl = rowEl.querySelector('.sim-q');
      var aEl = rowEl.querySelector('.sim-a');
      var eEl = rowEl.querySelector('.sim-e');
      selEl.onchange = function(){ row().disc = selEl.value; saveState(); };
      qEl.oninput = function(){ row().questoes = qEl.value; saveState(); refreshEntryStats(entryEl, entry()); };
      aEl.oninput = function(){ row().acertos = aEl.value; saveState(); refreshEntryStats(entryEl, entry()); };
      eEl.oninput = function(){ row().erros = eEl.value; saveState(); refreshEntryStats(entryEl, entry()); };
      var rm = rowEl.querySelector('.row-remove');
      if(rm){
        rm.onclick = function(){
          entry().rows.splice(ridx,1);
          saveState();
          onChange();
        };
      }
    });

    entryEl.querySelector('.sim-remove').onclick = function(){
      var ent = entry();
      discardFile(ent.fileMeta);
      state.simulados[key].splice(idx,1);
      saveState();
      onChange();
    };
    var fileInput = entryEl.querySelector('.sim-file-input');
    if(fileInput){
      fileInput.onchange = function(){
        var f = fileInput.files[0];
        fileInput.value = '';
        if(!f) return;
        var problem = fileProblem(f);
        if(problem){ alert(problem); return; }
        var nameEl = entryEl.querySelector('.sim-file .fname');
        nameEl.textContent = 'Enviando '+f.name+'…';
        entryEl.querySelector('.sim-file').classList.add('uploading');
        uploadFile(f, f.name, f.type).then(function(file){
          var old = entry().fileMeta;
          entry().fileMeta = {name:file.name, type:file.type, size:file.size, fileId:file.id};
          saveState();
          discardFile(old);
          onChange();
        }).catch(function(err){
          alert(fileErrorMessage(err));
          onChange();
        });
      };
    }
    var openLink = entryEl.querySelector('.sim-open');
    if(openLink){
      openLink.onclick = function(ev){
        ev.preventDefault();
        var meta = entry().fileMeta;
        if(!meta) return;
        if(meta.fileId){ window.open(fileUrl(meta.fileId), '_blank'); return; }
        // anexo antigo, salvo só no navegador: envia para o servidor e abre
        var win = window.open('about:blank', '_blank');
        migrateEntryFile(entry()).then(function(ok){
          if(ok){
            saveState();
            if(win) win.location = fileUrl(entry().fileMeta.fileId);
            onChange();
          } else {
            if(win) win.close();
            alert('Este anexo é de antes da mudança para o servidor e ficou salvo só no navegador onde foi anexado. Abra o site uma vez naquele navegador para que ele seja enviado automaticamente.');
          }
        });
      };
    }
  });
}
function refreshEntryStats(entryEl, entry){
  Array.prototype.forEach.call(entryEl.querySelectorAll('.sim-row'), function(rowEl){
    var ridx = parseInt(rowEl.getAttribute('data-ridx'),10);
    var row = entry.rows[ridx];
    var rpct = (row.questoes && Number(row.questoes)>0) ? Math.round((Number(row.acertos)||0)/Number(row.questoes)*100) : null;
    rowEl.querySelector('.sim-row-pct').textContent = rpct!==null ? (rpct+'%') : '—';
  });
  var tot = entryTotals(entry);
  var statsMain = entryEl.querySelector('.sim-stats-main');
  statsMain.innerHTML = 'Aproveitamento geral deste simulado: <strong>'+(tot.pct!==null?(tot.pct+'%'):'—')+'</strong>'+
    (tot.q>0 ? (' <span class="sim-stats-sub">('+tot.a+' acertos de '+tot.q+' questões, '+tot.e+' erros)</span>') : '');
}

/* ============ RENDER: SEMANAL ============ */
function renderSemanal(){
  var el = document.getElementById('view-semanal');
  var mon = ui.weekAnchor;
  var weekDates = [];
  for(var i=0;i<7;i++) weekDates.push(addDays(mon,i));
  var sun = weekDates[6];

  var head = '<h2 class="view-title">Visão semanal</h2>'+
    '<div class="week-nav">'+
      '<button class="iconbtn" id="week-prev" aria-label="Semana anterior">‹</button>'+
      '<div class="week-title">'+fmtDateShort(mon)+' – '+fmtDateShort(sun)+' de '+keyToDate(sun).getFullYear()+'</div>'+
      '<button class="iconbtn" id="week-next" aria-label="Próxima semana">›</button>'+
    '</div>';

  var simuladoKey = null;
  var overdue = computeOverdueMakeups();
  var rows = weekDates.map(function(k){
    var dt = keyToDate(k);
    var day = DAY_BY_DATE[k];
    var tag='', desc='', prog='';
    var makeupN = (overdue.byDate[k]||[]).length;
    if(k===META.primeiraFase || (META.f2Id && k===META.segundaFase)){
      tag = '<span class="type-tag exam">Prova</span>';
      desc = k===META.primeiraFase ? '1ª fase · prova objetiva' : '2ª fase · prova prático-profissional';
    } else if(!day){
      tag = '<span class="type-tag off">'+(k < FIRST_DATE ? 'Antes do início' : 'Descanso')+'</span>';
      desc = 'Sem estudos programados';
    } else {
      var discSet = {};
      day.items.forEach(function(it){ discSet[it.discName]=1; });
      var discNames = Object.keys(discSet).join(', ');
      if(day.type==='content'){
        tag = '<span class="type-tag content">Conteúdo</span>';
        desc = escapeHtml(discNames);
      } else if(day.type==='review'){
        tag = '<span class="type-tag review">Revisão</span>';
        desc = escapeHtml(day.discName)+(day.items.length ? ' · '+escapeHtml(discNames) : '');
      } else {
        if(!simuladoKey || dt.getDay()===META.simDow) simuladoKey = k;
        tag = day.practice===2 ? '<span class="type-tag simulado">Treino 2ª fase</span>' : '<span class="type-tag simulado">Simulado</span>';
        desc = (day.practice===2 ? 'Peças e questões discursivas' : 'Questões e simulados')+(day.items.length ? ' · '+escapeHtml(discNames) : '');
      }
      var dc = dayDoneCount(day);
      if(day.items.length){
        prog = dc+'/'+day.items.length;
        if(k < todayK && dc < day.items.length){
          prog = '<span class="wprog-overdue">'+(day.items.length-dc)+' pendente'+((day.items.length-dc)===1?'':'s')+'</span>';
        }
      } else if(day.type==='review'){
        prog = isReviewDone(k) ? 'concluída' : 'pendente';
      } else {
        var n = (state.simulados[k]||[]).length;
        prog = n>0 ? (n+' registro'+(n===1?'':'s')) : 'sem registro';
      }
    }
    if(makeupN>0){
      desc += ' <span class="wdesc-makeup">+ '+makeupN+' reposiç'+(makeupN===1?'ão':'ões')+'</span>';
    }
    var clickable = !!day || k===META.primeiraFase || k===META.segundaFase;
    return '<div class="week-row'+(k===todayK?' today':'')+(clickable?'':' nolink')+'" data-date="'+k+'" data-clickable="'+(clickable?'1':'0')+'"'+(clickable?' tabindex="0" role="button"':'')+'>'+
      '<div class="wd">'+DOW_SHORT[dt.getDay()]+'<span class="dt">'+pad2(dt.getDate())+'</span></div>'+
      '<div class="wsum">'+tag+'<div class="wdesc">'+desc+'</div></div>'+
      '<div class="wprog">'+prog+'</div>'+
    '</div>';
  }).join('');

  var simuladoBlock = '';
  if(simuladoKey){
    simuladoBlock = '<div class="section-block">'+
      '<h3>Registro da semana · '+DOW_NAMES[keyToDate(simuladoKey).getDay()].toLowerCase()+', '+fmtDateShort(simuladoKey)+'</h3>'+
      renderSimuladoDay(simuladoKey, DAY_BY_DATE[simuladoKey])+
    '</div>';
  }

  el.innerHTML = head + '<div class="week-list">'+rows+'</div>' + simuladoBlock;
  document.getElementById('week-prev').onclick = function(){ ui.weekAnchor = addDays(mon,-7); renderSemanal(); };
  document.getElementById('week-next').onclick = function(){ ui.weekAnchor = addDays(mon,7); renderSemanal(); };
  Array.prototype.forEach.call(document.querySelectorAll('.week-row[data-clickable="1"]'), function(row){
    function go(){
      ui.dailyDate = clampKey(row.getAttribute('data-date'));
      switchTab('diario');
    }
    row.onclick = go;
    row.onkeydown = function(e){ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); go(); } };
  });
  if(simuladoKey){
    var simContainer = el.querySelector('.simulado-wrap');
    bindSimuladoEvents(simContainer, simuladoKey, renderSemanal);
  }
}

/* ============ RENDER: MENSAL ============ */
function renderMensal(){
  var el = document.getElementById('view-mensal');
  var y = ui.monthYear, m = ui.monthMonth;
  var first = new Date(y,m,1);
  var startOffset = (first.getDay()+6)%7; // Monday=0
  var daysInMonth = new Date(y,m+1,0).getDate();

  var head = '<h2 class="view-title">Visão mensal</h2>'+
    '<div class="month-nav">'+
      '<button class="iconbtn" id="month-prev">‹</button>'+
      '<div class="month-title">'+MONTH_NAMES[m].replace(/^./,function(c){return c.toUpperCase();})+' de '+y+'</div>'+
      '<button class="iconbtn" id="month-next">›</button>'+
    '</div>';

  var dow = '<div class="cal-grid">'+DOW_SHORT.slice(1).concat([DOW_SHORT[0]]).map(function(s){return '<div class="cal-dow">'+s+'</div>';}).join('');
  var cells = '';
  for(var i=0;i<startOffset;i++) cells += '<div class="cal-cell empty"></div>';
  for(var d=1; d<=daysInMonth; d++){
    var key = y+'-'+pad2(m+1)+'-'+pad2(d);
    var day = DAY_BY_DATE[key];
    var doneCls = day && isDayFullyDone(day) ? ' done' : '';
    var todayCls = key===todayK ? ' today' : '';
    var isExam = key===META.primeiraFase || (META.f2Id && key===META.segundaFase);
    var dot = isExam ? '<span class="dot exam"></span>' : (day ? '<span class="dot '+day.type+'"></span>' : '');
    cells += '<div class="cal-cell'+doneCls+todayCls+(isExam?' exam':'')+(day||isExam?'':' off')+'" data-date="'+key+'" title="'+(isExam?'Dia da prova':'')+'"><span class="dn">'+d+'</span>'+dot+'</div>';
  }
  var grid = dow + cells + '</div>';

  var legend = '<div class="cal-legend">'+
    '<span><i style="background:var(--ink-soft)"></i>Conteúdo</span>'+
    '<span><i style="background:var(--garnet)"></i>Revisão intensiva</span>'+
    '<span><i style="background:var(--gold)"></i>Questões/simulado</span>'+
    '<span><i style="background:var(--green)"></i>Dia concluído</span>'+
    '<span><i style="background:transparent;box-shadow:0 0 0 2px var(--garnet) inset"></i>Dia de prova</span>'+
  '</div>';

  el.innerHTML = head + grid + legend;
  document.getElementById('month-prev').onclick = function(){
    ui.monthMonth--; if(ui.monthMonth<0){ui.monthMonth=11; ui.monthYear--;}
    renderMensal();
  };
  document.getElementById('month-next').onclick = function(){
    ui.monthMonth++; if(ui.monthMonth>11){ui.monthMonth=0; ui.monthYear++;}
    renderMensal();
  };
  Array.prototype.forEach.call(document.querySelectorAll('.cal-cell[data-date]'), function(c){
    c.onclick = function(){
      ui.dailyDate = clampKey(c.getAttribute('data-date'));
      switchTab('diario');
    };
  });
}

/* ============ CÓPIA DE SEGURANÇA AUTOMÁTICA (a cada 10 minutos, no servidor) ============ */
var BACKUP_EVERY_MS = 10*60*1000;
var backupTimer = null;
function runBackup(){
  if(!currentUser) return;
  var flush = savePending ? pushState() : Promise.resolve();
  flush.then(function(){
    return api('/api/backup', {method:'POST'});
  }).then(function(r){
    return r.ok ? r.json() : null;
  }).then(function(data){
    if(data && data.ts) setBackupStatus(data.ts);
  }).catch(function(){});
}
function setBackupStatus(ts){
  var el = document.getElementById('backup-status');
  if(!el) return;
  var d = new Date(ts);
  el.textContent = 'Última cópia de segurança: '+pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+' às '+pad2(d.getHours())+':'+pad2(d.getMinutes());
}
function startAutoBackup(){
  if(backupTimer) return;
  runBackup();
  backupTimer = setInterval(runBackup, BACKUP_EVERY_MS);
}

/* ============ FORMULÁRIO DO PLANO (logo após criar a conta, ou para ajustar) ============ */
function currentDoneIds(){
  var out = [];
  for(var id in state.lessons){ if(state.lessons[id] && state.lessons[id].done) out.push(id); }
  return out;
}
function onbChips(name, opts, selected, extraCls){
  return '<div class="chips'+(extraCls?' '+extraCls:'')+'">'+opts.map(function(o){
    return '<label class="chip"><input type="radio" name="'+name+'" value="'+escapeHtml(o.v)+'"'+
      (selected!==undefined && selected!==null && String(selected)===String(o.v) ? ' checked' : '')+'>'+
      '<span>'+o.l+(o.s ? '<small>'+o.s+'</small>' : '')+'</span></label>';
  }).join('')+'</div>';
}
function showOnboarding(isEdit){
  var overlay = document.getElementById('boot-overlay');
  if(!overlay) return;
  var today = todayKey();
  var cur = (isEdit && PROFILE) ? PROFILE : {};
  var exams = EXAMS.filter(function(e){ return e.primeiraFase > today || e.id===cur.exam; });

  var examOpts = exams.map(function(e){
    return {v:e.id, l:escapeHtml(e.name.replace(' Unificado','')), s:'1ª fase: '+fmtDateBr(e.primeiraFase)+'<br>2ª fase: '+fmtDateBr(e.segundaFase)};
  });
  var hourOpts = [1,2,3,4,5,6,7,8].map(function(h){ return {v:h, l:h+' h'}; });
  var dowOpts = [1,2,3,4,5,6,0].map(function(d){ return {v:d, l:DOW_NAMES[d].replace('-feira','')}; });
  var f2Opts = F2.map(function(d){ return {v:d.id, l:escapeHtml(d.name)}; }).concat([{v:'none', l:'Ainda não sei'}]);
  var f2Sel = isEdit ? (cur.fase2 ? cur.fase2 : 'none') : null;

  overlay.innerHTML =
    '<div class="boot-card onb-card">'+
      '<h2 class="boot-title">'+(isEdit ? 'Ajustar meu cronograma' : 'Vamos montar seu cronograma')+'</h2>'+
      '<p>'+(isEdit
        ? 'O cronograma será refeito a partir de hoje. As aulas que você já concluiu continuam marcadas e saem da distribuição.'
        : 'Quatro respostas e o plano fica pronto. Ele começa hoje, '+fmtDateLong(today)+', então você não entra com matérias atrasadas.')+'</p>'+
      '<form id="onb-form" novalidate>'+
        '<fieldset class="onb-q"><legend>Qual Exame de Ordem você vai prestar?</legend>'+onbChips('exam', examOpts, cur.exam, 'chips-exam')+'</fieldset>'+
        '<fieldset class="onb-q"><legend>Quantas horas por dia, no máximo, você pretende estudar?</legend>'+onbChips('hours', hourOpts, cur.hours)+
          '<p class="onb-hint">Cada aula tem, em média, '+MIN_PER_LESSON+' minutos.</p></fieldset>'+
        '<fieldset class="onb-q"><legend>Qual dia da semana você prefere deixar para descanso?</legend>'+onbChips('rest', dowOpts, cur.restDow)+
          '<p class="onb-hint">O dia anterior ao descanso fica para questões e simulado.</p></fieldset>'+
        '<fieldset class="onb-q"><legend>Qual matéria você vai escolher para a 2ª fase?</legend>'+onbChips('fase2', f2Opts, f2Sel)+
          '<p class="onb-hint">As aulas da 2ª fase começam 1 mês antes da prova da 1ª fase e vão até a véspera da 2ª.</p></fieldset>'+
        '<div class="onb-preview" id="onb-preview" aria-live="polite"></div>'+
        '<p class="boot-error" id="onb-error" role="alert" hidden></p>'+
        '<div class="onb-actions">'+
          (isEdit ? '<button type="button" class="btn ghost" id="onb-cancel">Cancelar</button>' : '<span></span>')+
          '<button type="submit" class="btn onb-submit" id="onb-submit">'+(isEdit ? 'Refazer cronograma' : 'Montar meu cronograma')+'</button>'+
        '</div>'+
      '</form>'+
    '</div>';
  overlay.classList.add('scroll');
  overlay.style.display = 'flex';
  overlay.scrollTop = 0;

  var form = document.getElementById('onb-form');
  var preview = document.getElementById('onb-preview');
  var errEl = document.getElementById('onb-error');
  var btn = document.getElementById('onb-submit');

  function val(name){ var c = form.querySelector('input[name="'+name+'"]:checked'); return c ? c.value : null; }
  function readProfile(){
    var exam = val('exam'), hours = val('hours'), rest = val('rest'), f2 = val('fase2');
    if(exam===null || hours===null || rest===null || f2===null) return null;
    return {
      exam: exam,
      hours: Number(hours),
      restDow: Number(rest),
      fase2: f2==='none' ? '' : f2,
      startDate: todayKey(),
      preDone: currentDoneIds(),
      updatedAt: new Date().toISOString()
    };
  }
  function updatePreview(){
    var prof = readProfile();
    if(!prof){ preview.innerHTML = ''; preview.hidden = true; return; }
    var plan = computePlan(prof), m = plan.meta, st = plan.stats;
    var avg = String(Math.round(st.avgLoad*10)/10).replace('.', ',');
    preview.hidden = false;
    preview.innerHTML =
      '<strong>Resumo do plano.</strong> De '+fmtDateBr(m.startDate)+' a '+fmtDateBr(addDays(m.endDate,-1))+
      ', média de '+avg+' aulas por dia de estudo, '+st.reviews+' dia'+(st.reviews===1?'':'s')+' de revisão intensiva antes da 1ª fase'+
      ' e questões/simulado '+weeklyPhrase(m.simDow)+'.'+
      (m.f2Id ? ' A 2ª fase ('+escapeHtml(m.f2Name)+', '+m.f2Total+' aulas) começa em '+fmtDateBr(m.f2Start)+'.' : '')+
      (st.overCap ? '<span class="onb-warn">Para caber até a prova, alguns dias terão até '+st.maxLoad+' aulas (cerca de '+
        hoursTxt(st.maxLoad*MIN_PER_LESSON/60)+'), acima do limite escolhido.</span>' : '');
  }
  form.onchange = function(){ errEl.hidden = true; updatePreview(); };
  updatePreview();

  var cancel = document.getElementById('onb-cancel');
  if(cancel) cancel.onclick = hideOverlay;

  form.onsubmit = function(ev){
    ev.preventDefault();
    var prof = readProfile();
    if(!prof){
      errEl.textContent = 'Responda as quatro perguntas para montar o cronograma.';
      errEl.hidden = false;
      return;
    }
    var previous = state.profile;
    state.profile = prof;
    btn.disabled = true;
    btn.textContent = 'Montando…';
    clearTimeout(saveTimer);
    api(STORE_ENDPOINT, {method:'POST', json: state}).then(function(r){
      if(!r.ok) throw httpError(r);
      savePending = false;
      setSyncStatus('ok');
      applyPlan(computePlan(prof));
      if(appStarted){
        resetUi();
        renderCapa();
        switchTab('painel');
        hideOverlay();
      } else {
        hideOverlay();
        startApp();
      }
    }).catch(function(err){
      state.profile = previous;
      btn.disabled = false;
      btn.textContent = isEdit ? 'Refazer cronograma' : 'Montar meu cronograma';
      errEl.textContent = (err && err.code===401)
        ? 'Sua sessão expirou. Recarregue a página e entre de novo.'
        : 'Não foi possível salvar suas respostas. Verifique sua internet e tente de novo.';
      errEl.hidden = false;
    });
  };
}

/* ============ BOOT (carregamento + autenticação) ============ */
function showOverlay(message, showRetry){
  var overlay = document.getElementById('boot-overlay');
  if(!overlay) return;
  overlay.innerHTML =
    '<div class="boot-card">'+
      '<div class="boot-spinner"'+(showRetry?' style="display:none;"':'')+'></div>'+
      '<p>'+escapeHtml(message)+'</p>'+
      (showRetry ? '<button type="button" id="boot-retry" class="btn">Tentar novamente</button>' : '')+
    '</div>';
  overlay.style.display = 'flex';
  if(showRetry){
    document.getElementById('boot-retry').onclick = boot;
  }
}
function hideOverlay(){
  var overlay = document.getElementById('boot-overlay');
  if(!overlay) return;
  overlay.style.display = 'none';
  overlay.classList.remove('scroll');
}
var AUTH_ERRORS = {
  invalid_credentials: 'Usuário ou senha incorretos.',
  username_taken: 'Esse usuário já existe. Escolha outro.',
  invalid_name: 'Informe seu nome completo.',
  invalid_username: 'O usuário precisa ter de 3 a 30 caracteres: letras minúsculas, números, ponto, hífen ou sublinhado.',
  invalid_password: 'A senha precisa ter pelo menos 6 caracteres.',
  too_many_attempts: 'Muitas tentativas erradas. Aguarde 15 minutos e tente de novo.'
};

function authField(id, label, type, autocomplete, hint){
  return '<div class="auth-field">'+
    '<label for="'+id+'">'+label+'</label>'+
    '<input type="'+type+'" id="'+id+'" class="boot-input" autocomplete="'+autocomplete+'"'+
      (type==='text' ? ' autocapitalize="'+(id==='auth-name'?'words':'none')+'" spellcheck="false"' : '')+
      (hint ? ' aria-describedby="'+id+'-hint"' : '')+'>'+
    (hint ? '<div class="auth-hint" id="'+id+'-hint">'+hint+'</div>' : '')+
  '</div>';
}

function showAuthScreen(mode, message){
  var overlay = document.getElementById('boot-overlay');
  if(!overlay) return;
  var isLogin = mode !== 'register';
  overlay.innerHTML =
    '<div class="boot-card auth-card">'+
      '<h2 class="boot-title">'+(isLogin ? 'Entrar no plano de estudos' : 'Criar conta')+'</h2>'+
      '<p>'+(isLogin
        ? 'Entre com seu usuário e senha para abrir o seu cronograma.'
        : 'Cada conta tem o próprio progresso, salvo no servidor.')+'</p>'+
      '<p class="boot-error" id="auth-error" role="alert"'+(message ? '' : ' hidden')+'>'+escapeHtml(message || '')+'</p>'+
      '<form id="auth-form" novalidate>'+
        (isLogin ? '' : authField('auth-name', 'Nome completo', 'text', 'name'))+
        authField('auth-user', 'Usuário', 'text', 'username',
          isLogin ? '' : 'De 3 a 30 caracteres: letras minúsculas, números, ponto, hífen ou sublinhado.')+
        authField('auth-pass', 'Senha', 'password', isLogin ? 'current-password' : 'new-password',
          isLogin ? '' : 'Pelo menos 6 caracteres.')+
        '<button type="submit" class="btn auth-submit" id="auth-submit">'+(isLogin ? 'Entrar' : 'Criar conta')+'</button>'+
      '</form>'+
      '<p class="auth-switch">'+(isLogin
        ? 'Ainda não tem conta? <button type="button" class="linkbtn" id="auth-switch">Criar conta</button>'
        : 'Já tem conta? <button type="button" class="linkbtn" id="auth-switch">Entrar</button>')+'</p>'+
    '</div>';
  overlay.style.display = 'flex';

  var form = document.getElementById('auth-form');
  var errEl = document.getElementById('auth-error');
  var btn = document.getElementById('auth-submit');
  var nameEl = document.getElementById('auth-name');
  var userEl = document.getElementById('auth-user');
  var passEl = document.getElementById('auth-pass');
  (nameEl || userEl).focus();

  function showError(msg){ errEl.textContent = msg; errEl.hidden = false; }

  document.getElementById('auth-switch').onclick = function(){
    showAuthScreen(isLogin ? 'register' : 'login');
  };

  form.onsubmit = function(ev){
    ev.preventDefault();
    var payload = {
      username: userEl.value.trim().toLowerCase(),
      password: passEl.value
    };
    if(!isLogin){
      payload.name = nameEl.value.trim().replace(/\s+/g, ' ');
      if(payload.name.length < 2){ showError(AUTH_ERRORS.invalid_name); nameEl.focus(); return; }
      if(!/^[a-z0-9._-]{3,30}$/.test(payload.username)){ showError(AUTH_ERRORS.invalid_username); userEl.focus(); return; }
      if(payload.password.length < 6){ showError(AUTH_ERRORS.invalid_password); passEl.focus(); return; }
    } else if(!payload.username || !payload.password){
      showError('Preencha usuário e senha.');
      return;
    }

    btn.disabled = true;
    btn.textContent = isLogin ? 'Entrando…' : 'Criando conta…';
    api(isLogin ? '/api/login' : '/api/register', {method:'POST', json: payload}).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(data){
        if(!r.ok){
          var msg = AUTH_ERRORS[data && data.error] ||
            'Não foi possível falar com o servidor. Verifique sua internet e tente de novo.';
          throw new Error(msg);
        }
        onLoggedIn(data.user);
      });
    }).catch(function(err){
      btn.disabled = false;
      btn.textContent = isLogin ? 'Entrar' : 'Criar conta';
      showError(err && err.message && err.message.indexOf('Failed to fetch') < 0
        ? err.message
        : 'Não foi possível falar com o servidor. Verifique sua internet e tente de novo.');
    });
  };
}

function onLoggedIn(user){
  if(appStarted){
    // Sessão expirou no meio do uso: se voltou a mesma pessoa, só reenvia o que faltava salvar.
    if(currentUser && user && currentUser.username === user.username){
      hideOverlay();
      if(savePending) pushState();
      return;
    }
    // Outra conta entrou nesta aba: recarrega para não misturar dados.
    location.reload();
    return;
  }
  currentUser = user;
  loadAndStart();
}

function loadAndStart(){
  showOverlay('Carregando seus dados…');
  loadStateFromServer().then(function(){
    if(isValidProfile(state.profile)){
      applyPlan(computePlan(state.profile));
      hideOverlay();
      startApp();
    } else {
      showOnboarding(false);
    }
  }).catch(function(err){
    if(err && err.code===401) showAuthScreen('login', 'Sua sessão expirou. Entre de novo.');
    else showOverlay('Não foi possível conectar ao servidor. Verifique sua internet e tente novamente.', true);
  });
}

function logout(){
  var btn = document.getElementById('logout-btn');
  btn.disabled = true;
  var flush = savePending ? pushState() : Promise.resolve();
  flush.then(function(){
    return api('/api/logout', {method:'POST'});
  }).then(function(r){
    if(!r.ok) throw httpError(r);
    location.reload();
  }).catch(function(){
    btn.disabled = false;
    alert('Não foi possível sair agora. Verifique sua conexão e tente de novo.');
  });
}

function firstName(full){ return String(full || '').trim().split(/\s+/)[0] || ''; }

function boot(){
  showOverlay('Carregando…');
  api('/api/me').then(function(r){
    if(r.status===401){ showAuthScreen('login'); return; }
    if(!r.ok) throw httpError(r);
    return r.json().then(function(data){ onLoggedIn(data.user); });
  }).catch(function(){
    showOverlay('Não foi possível conectar ao servidor. Verifique sua internet e tente novamente.', true);
  });
}

/* ============ INIT ============ */
function renderCapa(){
  document.getElementById('capa-title').textContent = META.examName;
  document.getElementById('capa-sub').textContent =
    'Seu cronograma: '+F1.length+' disciplinas e '+META.p1Total+' aulas na 1ª fase'+
    (META.f2Id ? ', mais '+META.f2Total+' aulas de '+META.f2Name+' na 2ª fase.' : '.');
  document.getElementById('capa-edital').textContent = fmtDateBr(META.editalAbertura);
  document.getElementById('capa-inscr').textContent = fmtDateShort(META.inscricoesInicio)+' a '+fmtDateBr(META.inscricoesFim);
  document.getElementById('capa-f1').textContent = fmtDateBr(META.primeiraFase);
  document.getElementById('capa-f2').textContent = fmtDateBr(META.segundaFase);
  document.title = 'Plano de estudos · '+META.examName;
}
function startApp(){
  if(appStarted) return;
  appStarted = true;
  document.getElementById('user-greeting').textContent = 'Olá, '+firstName(currentUser.name);
  document.getElementById('user-handle').textContent = '@'+currentUser.username;
  document.querySelector('.capa-hello').title = currentUser.name;
  document.getElementById('logout-btn').onclick = logout;
  tabs.forEach(function(t){
    document.getElementById('tabbtn-'+t).onclick = function(){ switchTab(t); };
  });
  resetUi();
  renderCapa();
  document.body.classList.add('app-ready');
  renderCurrentView();
  startAutoBackup();
  migrateLocalFiles();
  setInterval(function(){
    todayK = todayKey();
    var pf = document.getElementById('pf-count');
    if(pf) updateCountdownEl(pf);
  }, 1000);
  setInterval(function(){
    if(ui.tab==='painel') renderPainel();
  }, 60000);
}
document.addEventListener('DOMContentLoaded', boot);
})();
